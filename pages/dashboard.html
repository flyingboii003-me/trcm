<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TRCM - Dashboard">
<title>TRCM — Dashboard TRCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f3f6fc;--surface:#fff;--surface2:#f1f5fb;--border:#dde5f1;--primary:#2563eb;--text:#0b1426;--muted:#3d4b66;--active-bg:#eff6ff;--active-border:#dbeafe;--sidebar-collapsed:72px;--sidebar-expanded:240px;--topbar:60px;--transition:.22s ease}
html[data-theme="dark"]{color-scheme:dark;--bg:#070b16;--surface:#0f1729;--surface2:#162238;--border:#1f2c45;--primary:#3b82f6;--text:#e6edf7;--muted:#94a3b8;--active-bg:#172554;--active-border:#1e3a8a}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased;transition:background var(--transition),color var(--transition)}.app-shell{min-height:100vh}.sidebar{position:fixed;z-index:20;inset:0 auto 0 0;width:var(--sidebar-collapsed);padding:14px 10px;background:var(--surface);border-right:1px solid var(--border);transition:width var(--transition),background var(--transition),border-color var(--transition);overflow:hidden}.sidebar:hover,.sidebar:focus-within{width:var(--sidebar-expanded)}.brand{height:44px;display:flex;align-items:center;gap:12px;padding:0 9px;margin-bottom:20px;white-space:nowrap}.brand-mark{width:36px;height:36px;display:grid;place-items:center;flex:0 0 auto;border-radius:10px;background:var(--primary);color:#fff}.brand-mark .material-symbols-rounded{font-size:20px}.brand-name{font-size:17px;font-weight:700;opacity:0;transition:opacity var(--transition)}.sidebar:hover .brand-name,.sidebar:focus-within .brand-name{opacity:1}.nav{display:flex;flex-direction:column;gap:5px}.nav-link{height:44px;display:flex;align-items:center;gap:13px;padding:0 11px;color:var(--muted);border:1px solid transparent;border-radius:10px;text-decoration:none;white-space:nowrap;transition:background var(--transition),color var(--transition),border-color var(--transition)}.nav-link .material-symbols-rounded{font-size:21px;flex:0 0 auto}.nav-link span:last-child{opacity:0;transition:opacity var(--transition)}.sidebar:hover .nav-link span:last-child,.sidebar:focus-within .nav-link span:last-child{opacity:1}.nav-link:hover{color:var(--text);background:var(--surface2)}.nav-link.active{color:var(--primary);background:var(--active-bg);border-color:var(--active-border)}.main{margin-left:var(--sidebar-collapsed);min-height:100vh;transition:margin-left var(--transition)}.topbar{height:var(--topbar);position:sticky;top:0;z-index:10;display:flex;align-items:center;padding:0 28px;background:color-mix(in srgb,var(--surface) 84%,transparent);border-bottom:1px solid var(--border);backdrop-filter:blur(14px)}.topbar-title{margin:0;font-size:17px;font-weight:700}.theme-button{width:38px;height:38px;display:grid;place-items:center;margin-left:auto;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:color var(--transition),background var(--transition),border-color var(--transition)}.theme-button:hover{color:var(--text);background:var(--surface2)}.theme-button .material-symbols-rounded{font-size:20px}.account-button{height:38px;display:inline-flex;align-items:center;gap:8px;margin-left:8px;padding:0 11px;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:color var(--transition),background var(--transition),border-color var(--transition)}.account-button:hover{color:var(--text);background:var(--surface2)}.account-button .material-symbols-rounded{font-size:20px}.account-name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500}.content{padding:28px 32px 36px}.page-intro{margin-bottom:20px}.page-intro h2{margin:0 0 5px;font-size:17px;font-weight:700}.page-intro p{margin:0;color:var(--muted);font-size:13px}.placeholder{min-height:240px;display:grid;place-items:center;padding:28px;background:var(--surface);border:1px solid var(--border);border-radius:16px;color:var(--muted);text-align:center}.placeholder strong{display:block;margin-bottom:6px;color:var(--text);font-size:14px}.placeholder span{font-size:12px}@media(max-width:700px){.sidebar{width:0;padding:14px 0;border-right:0}.sidebar.is-open{width:240px;padding:14px 10px;box-shadow:12px 0 30px rgba(11,20,38,.12)}.sidebar .brand-name,.sidebar .nav-link span:last-child{opacity:1}.main{margin-left:0}.topbar{padding:0 18px}.content{padding:22px 18px}.menu-button{width:38px;height:38px;display:grid;place-items:center;margin-right:10px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:10px;cursor:pointer}.sidebar-backdrop{display:block;position:fixed;inset:0;z-index:15;background:rgba(11,20,38,.25);opacity:0;visibility:hidden;transition:opacity var(--transition),visibility var(--transition)}.sidebar-backdrop.is-visible{opacity:1;visibility:visible}}@media(min-width:701px){.menu-button,.sidebar-backdrop{display:none}}
</style>
</head>
<body>
<div class="app-shell">
<aside class="sidebar" id="sidebar" aria-label="Navigasi utama">
<div class="brand"><div class="brand-mark"><span class="material-symbols-rounded">local_shipping</span></div><span class="brand-name">TRCM</span></div>
<nav class="nav">
<a class="nav-link active" href="dashboard.html" aria-current="page"><span class="material-symbols-rounded">dashboard</span><span>Dashboard TRCM</span></a>
<a class="nav-link" href="#" data-page="checker"><span class="material-symbols-rounded">fact_check</span><span>Checker</span></a>
<a class="nav-link" href="#" data-page="riwayat"><span class="material-symbols-rounded">history</span><span>Riwayat</span></a>
<a class="nav-link" href="#" data-page="master-data"><span class="material-symbols-rounded">database</span><span>Master data</span></a>
</nav>
</aside>
<div class="sidebar-backdrop" id="sidebar-backdrop"></div>
<main class="main">
<header class="topbar"><button class="menu-button" id="menu-button" type="button" aria-label="Buka menu"><span class="material-symbols-rounded">menu</span></button><h1 class="topbar-title">Dashboard TRCM</h1><button class="theme-button" id="theme-button" type="button" aria-label="Ubah tema" title="Ubah tema"><span class="material-symbols-rounded" id="theme-icon">dark_mode</span></button><button class="account-button" id="account-button" type="button" aria-label="Keluar dari akun" title="Keluar dari akun"><span class="material-symbols-rounded" aria-hidden="true">account_circle</span><span class="account-name" id="account-name">Akun</span><span class="material-symbols-rounded" aria-hidden="true">logout</span></button></header>
<section class="content">
<div class="page-intro"><h2>Dashboard TRCM</h2><p>Ringkasan dan pemantauan aktivitas truk di gudang.</p></div>
<div class="placeholder"><div><strong>Dashboard sedang dibangun</strong><span>Struktur navigasi sudah tersedia. Komponen dashboard akan dibuat pada tahap berikutnya.</span></div></div>
</section>
</main>
</div>
<script>
const root=document.documentElement,sidebar=document.getElementById("sidebar"),menuButton=document.getElementById("menu-button"),backdrop=document.getElementById("sidebar-backdrop"),themeButton=document.getElementById("theme-button"),themeIcon=document.getElementById("theme-icon"),accountButton=document.getElementById("account-button"),accountName=document.getElementById("account-name");
const trcmSession=JSON.parse(sessionStorage.getItem("trcm_session")||"null");if(!trcmSession||!trcmSession.access_token||!trcmSession.user){window.location.replace("../index.html")}else{accountName.textContent=trcmSession.user.username||"Akun"}
const savedTheme=localStorage.getItem("trcm_theme");if(savedTheme==="dark")root.dataset.theme="dark";
function updateThemeButton(){const dark=root.dataset.theme==="dark";themeIcon.textContent=dark?"light_mode":"dark_mode";themeButton.setAttribute("aria-label",dark?"Gunakan tema light":"Gunakan tema dark");themeButton.setAttribute("title",dark?"Gunakan tema light":"Gunakan tema dark")}
updateThemeButton();
themeButton.addEventListener("click",()=>{const dark=root.dataset.theme==="dark";if(dark)delete root.dataset.theme;else root.dataset.theme="dark";localStorage.setItem("trcm_theme",dark?"light":"dark");updateThemeButton()});
function toggleMenu(){sidebar.classList.toggle("is-open");backdrop.classList.toggle("is-visible")}function closeMenu(){sidebar.classList.remove("is-open");backdrop.classList.remove("is-visible")}
menuButton?.addEventListener("click",toggleMenu);backdrop.addEventListener("click",closeMenu);accountButton.addEventListener("click",()=>{sessionStorage.removeItem("trcm_session");window.location.replace("../index.html")});
</script>
</body>
</html>
