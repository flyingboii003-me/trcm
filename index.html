<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TRCM - Truck Registration & Control Management">
    <title>TRCM — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --bg: #070b16;
            --surface: #0f1729;
            --surface2: #162238;
            --border: #1f2c45;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text: #e6edf7;
            --muted: #94a3b8;
            --radius-card: 16px;
            --radius-control: 10px;
            --transition: 0.22s ease;
        }

        * { box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background:
                radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.12), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: "Inter", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input { font: inherit; }

        .login-shell { width: min(100%, 420px); }

        .login-card {
            padding: 32px;
            background: rgba(15, 23, 41, 0.94);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
        }

        .brand-mark .material-symbols-rounded { font-size: 23px; }

        .brand-name {
            margin: 0;
            font-size: 20px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        .heading {
            margin: 0 0 8px;
            font-size: 24px;
            line-height: 1.25;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .description {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .form-group { margin-bottom: 17px; }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
        }

        .input-wrap { position: relative; }

        .input-icon {
            position: absolute;
            top: 50%;
            left: 13px;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
            font-size: 19px;
        }

        .form-input {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 43px;
            color: var(--text);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-control);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .form-input::placeholder { color: #64748b; }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.14);
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 7px;
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            transform: translateY(-50%);
            color: var(--muted);
            background: transparent;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            transition: color var(--transition), background var(--transition);
        }

        .password-toggle:hover {
            color: var(--text);
            background: rgba(148, 163, 184, 0.08);
        }

        .submit-button {
            width: 100%;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            color: #fff;
            background: var(--primary);
            border: 1px solid var(--primary);
            border-radius: var(--radius-control);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), transform var(--transition);
        }

        .submit-button:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .submit-button:active { transform: translateY(1px); }

        .submit-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            margin-top: 16px;
            padding: 11px 12px;
            color: #fecaca;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.28);
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .error-message.is-visible { display: block; }

        .login-footer {
            margin-top: 22px;
            color: #64748b;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
        }

        .mono { font-family: "JetBrains Mono", monospace; }

        @media (max-width: 700px) {
            body { padding: 18px; }
            .login-card { padding: 26px 22px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-card" aria-labelledby="login-title">
            <header class="brand">
                <div class="brand-mark" aria-hidden="true">
                    <span class="material-symbols-rounded">local_shipping</span>
                </div>
                <div>
                    <h1 class="brand-name">TRCM</h1>
                    <p class="brand-subtitle">Truck Registration &amp; Control Management</p>
                </div>
            </header>

            <div>
                <h2 id="login-title" class="heading">Masuk ke TRCM</h2>
                <p class="description">Masukkan username dan password untuk melanjutkan ke sistem.</p>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrap">
                        <span class="material-symbols-rounded input-icon" aria-hidden="true">person</span>
                        <input class="form-input" id="username" name="username" type="text" autocomplete="username" placeholder="Masukkan username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrap">
                        <span class="material-symbols-rounded input-icon" aria-hidden="true">lock</span>
                        <input class="form-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
                        <button class="password-toggle" id="password-toggle" type="button" aria-label="Tampilkan password" title="Tampilkan password">
                            <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                        </button>
                    </div>
                </div>

                <button class="submit-button" id="login-button" type="submit">
                    <span>Masuk</span>
                    <span class="material-symbols-rounded" aria-hidden="true">arrow_forward</span>
                </button>

                <div class="error-message" id="error-message" role="alert"></div>
            </form>

            <footer class="login-footer">
                TRCM <span class="mono">v1.0</span>
            </footer>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const passwordToggle = document.getElementById("password-toggle");
        const errorMessage = document.getElementById("error-message");
        const loginButton = document.getElementById("login-button");

        passwordToggle.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";

            passwordToggle.setAttribute(
                "aria-label",
                isPassword ? "Sembunyikan password" : "Tampilkan password"
            );

            passwordToggle.setAttribute(
                "title",
                isPassword ? "Sembunyikan password" : "Tampilkan password"
            );

            passwordToggle.querySelector(".material-symbols-rounded").textContent =
                isPassword ? "visibility_off" : "visibility";
        });

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            errorMessage.classList.remove("is-visible");
            errorMessage.textContent = "";

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                errorMessage.textContent = "Username dan password wajib diisi.";
                errorMessage.classList.add("is-visible");

                if (!username) {
                    usernameInput.focus();
                } else {
                    passwordInput.focus();
                }

                return;
            }

            loginButton.disabled = true;
            loginButton.querySelector("span:first-child").textContent = "Memproses...";

            window.setTimeout(() => {
                loginButton.disabled = false;
                loginButton.querySelector("span:first-child").textContent = "Masuk";

                errorMessage.textContent = "Autentikasi belum terhubung ke Supabase Auth.";
                errorMessage.classList.add("is-visible");
            }, 500);
        });
    </script>
</body>
</html>
