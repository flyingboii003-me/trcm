<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TRCM - Halaman tidak ditemukan">
<title>404 — TRCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/trcm.css">
<style>
.not-found-shell{min-height:calc(100vh - 48px);display:flex;align-items:center;justify-content:center;padding:32px 16px}
.not-found-card{width:min(680px,100%);text-align:center;padding:48px 32px;border:1px solid #e7eeee;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(28,48,40,.08)}
.not-found-code{font-size:clamp(72px,14vw,132px);line-height:.9;font-weight:700;letter-spacing:-.08em;color:#006ECD;margin-bottom:20px}
.not-found-icon{width:72px;height:72px;margin:0 auto 20px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:#edf6ff;color:#006ECD;font-size:32px}
.not-found-card h1{font-size:28px;font-weight:700;margin-bottom:10px;color:#17231f}
.not-found-card p{max-width:500px;margin:0 auto 28px;color:#6b7b74;line-height:1.7}
.not-found-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media(max-width:576px){.not-found-card{padding:40px 22px;border-radius:20px}.not-found-card h1{font-size:24px}}
</style>
</head>
<body class="trcm-app">
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="topbar-container"></div>
    <main class="content-wrapper">
      <div class="container-fluid px-0">
        <div class="not-found-shell">
          <section class="not-found-card" aria-labelledby="not-found-title">
            <div class="not-found-code" aria-hidden="true">404</div>
            <div class="not-found-icon"><i class="bi bi-cone-striped"></i></div>
            <h1 id="not-found-title">Halaman belum tersedia</h1>
            <p>Halaman yang kamu cari belum siap digunakan atau alamatnya sudah tidak tersedia. Silakan kembali ke dashboard untuk melanjutkan pekerjaan.</p>
            <div class="not-found-actions">
              <a class="btn btn-primary" href="dashboard.html"><i class="bi bi-grid-1x2-fill me-1"></i>Kembali ke Dashboard</a>
              <button class="btn btn-light border" type="button" onclick="history.back()"><i class="bi bi-arrow-left me-1"></i>Halaman Sebelumnya</button>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../assets/js/components.js"></script>
</body>
</html>
