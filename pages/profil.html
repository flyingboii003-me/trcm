<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Profil pengguna TRCM">
<title>Profil — TRCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/trcm.css">
</head>
<body class="trcm-app">
<div class="app-layout">
  <div id="sidebar-container"></div>
  <div class="main-wrapper">
    <div id="topbar-container"></div>
    <main class="content-wrapper">
      <div class="container-fluid px-0">
        <section class="welcome-card alert-green-card mb-4">
          <div class="welcome-card-copy"><span class="welcome-kicker">PENGATURAN AKUN</span><h2>Profil Pengguna</h2><p>Informasi akun yang sedang digunakan untuk mengakses TRCM.</p></div>
        </section>
        <section class="card content-card">
          <div class="card-header content-card-header"><div><h2 class="card-title">Informasi akun</h2><p class="page-subtitle">Data identitas dari sesi login aktif.</p></div></div>
          <div class="card-body">
            <div id="profile-error" class="alert alert-danger d-none" role="alert"></div>
            <div id="profile-loading" class="text-secondary py-3">Memuat profil...</div>
            <div id="profile-content" class="row g-3 d-none">
              <div class="col-12 col-md-6"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small mb-1">Nama lengkap</div><div class="fw-semibold" id="profile-full-name">—</div></div></div>
              <div class="col-12 col-md-6"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small mb-1">Username</div><div class="fw-semibold" id="profile-username">—</div></div></div>
              <div class="col-12 col-md-6"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small mb-1">Email akun</div><div class="fw-semibold" id="profile-email">—</div></div></div>
              <div class="col-12 col-md-6"><div class="border rounded-3 p-3 h-100"><div class="text-secondary small mb-1">Role</div><div class="fw-semibold" id="profile-role">—</div></div></div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/components.js"></script>
<script>
window.trcmComponentsReady.then(async function () {
  const session = (() => { try { return JSON.parse(sessionStorage.getItem("trcm_session") || "null"); } catch { return null; } })();
  const loading = document.getElementById("profile-loading");
  const content = document.getElementById("profile-content");
  const error = document.getElementById("profile-error");
  if (!session || !session.access_token || !session.user) { window.location.replace("../index.html"); return; }
  const user = session.user;
  function put(id, value) { document.getElementById(id).textContent = value || "—"; }
  function renderProfile(profile) {
    put("profile-full-name", profile.full_name || profile.name);
    put("profile-username", profile.username);
    put("profile-email", profile.auth_email || profile.email);
    put("profile-role", profile.role_name || profile.role || (profile.role_key ? String(profile.role_key).replace(/_/g, " ") : ""));
    loading.classList.add("d-none");
    content.classList.remove("d-none");
  }

  // Login response may contain only the user ID and role. Read the signed-in
  // user's public profile so every role sees the same account details.
  renderProfile(user);
  try {
      const response = await fetch("https://pcednpmjyfkuomfcmian.supabase.co/rest/v1/rpc/get_my_profile", {
        method: "POST",
        headers: {
          "apikey": "sb_publishable_ERlBrySRotVM5jfLA1oukQ_Cg0gmgIp",
          "Authorization": "Bearer " + session.access_token,
          "Content-Type": "application/json"
        },
        body: "{}"
      });
      const rows = await response.json().catch(function () { return []; });
      if (!response.ok) {
        throw new Error(rows && rows.message ? rows.message : "Data profil gagal dimuat.");
      }
      if (Array.isArray(rows) && rows[0]) {
        renderProfile(Object.assign({}, user, rows[0]));
      } else if (!(user.full_name || user.name || user.username || user.auth_email || user.email)) {
        throw new Error("Data profil akun tidak ditemukan. Pastikan akun terdaftar pada data pengguna TRCM.");
      }
    } catch (profileError) {
      error.textContent = profileError.message || "Profil gagal dimuat. Periksa koneksi dan coba lagi.";
      error.classList.remove("d-none");
    }
});
</script>
</body>
</html>
