const visitModalBackdrop = document.getElementById("visit-modal-backdrop");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, function (character) {
    const replacements = {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    };
    return replacements[character];
  });
}

function showEditAlert(message, type) {
  editAlert.className = "alert alert-" + type;
  editAlert.textContent = message;
}

function clearEditAlert() {
  editAlert.className = "alert d-none";
  editAlert.textContent = "";
}

async function patchVisit(visitId, payload) {
  const response = await fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + encodeURIComponent(visitId), {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: "Bearer " + trcmSession.access_token,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    },
    body: JSON.stringify(payload)
  });
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = null; }
  if (response.status === 401) {
    sessionStorage.removeItem("trcm_session");
    window.location.replace("../index.html");
    return null;
  }
  if (!response.ok) {
    throw new Error(data && (data.message || data.details || data.hint) ? (data.message || data.details || data.hint) : "Data kunjungan gagal diperbarui.");
  }
  return data;
}

async function deleteVisit(visitId) {
  const response = await fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + encodeURIComponent(visitId), {
    method: "DELETE",
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: "Bearer " + trcmSession.access_token,
      Prefer: "return=minimal"
    }
  });
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = null; }
  if (response.status === 401) {
    sessionStorage.removeItem("trcm_session");
    window.location.replace("../index.html");
    return;
  }
  if (!response.ok) {
    throw new Error(data && (data.message || data.details || data.hint) ? (data.message || data.details || data.hint) : "Data kunjungan gagal dihapus.");
  }
}

function populateEditClients(selectedId) {
  const names = [];
  visits.forEach(function (visit) {

function formatDuration(start, end) {
  if (!start || !end) {
    return "—";
  }

  const startTime = new Date(start);
  const endTime = new Date(end);

  if (Number.isNaN(startTime.getTime()) || Number.isNaN(endTime.getTime())) {
    return "—";
  }

  const minutes = Math.max(0, Math.round((endTime - startTime) / 60000));
  const hours = Math.floor(minutes / 60);
  const remainingMinutes = minutes % 60;

  if (hours > 0) {
    return hours + "j " + String(remainingMinutes).padStart(2, "0") + "m";
  }

  return remainingMinutes + "m";
}

function formatTime(value) {
  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return new Intl.DateTimeFormat("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function renderKlienOptions() {
  const names = Array.from(
    new Set(
      visits
        .map(function (visit) {
          return visit.client || (visit.clients && visit.clients.name);
        })
        .filter(Boolean)
    )
  ).sort(function (a, b) {
    return a.localeCompare(b, "id");
  });

  filterClient.innerHTML =
    '<option value="">Semua klien</option>' +
    names
      .map(function (name) {
        return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + "</option>";
      })
      .join("");
}

function getVisitDate(visit) {
  return visit.wh_in_at || visit.created_at || null;
}

function filteredVisits() {
  const plate = filterPlate.value.trim().toLowerCase();
  const client = filterClient.value;
  const card = filterCard.value.trim().toLowerCase();
  const date = filterDate.value;

  return visits.filter(function (visit) {
    const visitPlate = String(visit.plate_number || "").toLowerCase();
    const visitDate = getVisitDate(visit);

    return (
      (!plate || visitPlate.includes(plate)) &&
      (!client || (visit.client || (visit.clients && visit.clients.name)) === client) &&
      (!card || String((visit.cards && visit.cards.card_number) || visit.card_number || "").toLowerCase().includes(card)) &&
      (!date || String(visitDate).slice(0, 10) === date)
    );
  });
}

function formatDateTime(value) {
  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return new Intl.DateTimeFormat("id-ID", {
    dateStyle: "medium",
    timeStyle: "short"
  }).format(date);
}

function displayValue(value) {
  return value === null || value === undefined || value === "" ? "—" : String(value);
}

function photoTypeLabel(type) {
  const labels = {
    seal_initial: "Seal awal",
    seal_final: "Seal akhir"
  };

  return labels[type] || displayValue(type);
}

function statusLabel(value) {
  return (window.trcmStatusLabels && window.trcmStatusLabels[value]) || displayValue(value);
}

function renderDetailItem(label, value, mono) {
  return '<div class="detail-item"><span class="detail-label">' +
    escapeHtml(label) + '</span><span class="detail-value' +
    (mono ? ' mono' : '') + '">' + escapeHtml(displayValue(value)) +
    "</span></div>";
}

async function openVisitModal(visitId) {
  visitModalBackdrop.classList.add("is-visible");
  visitModalBackdrop.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  visitModalTitle.textContent = "Memuat...";
  visitModalSubtitle.textContent = "";
  visitModalBody.innerHTML = '<div class="modal-loading">Memuat detail visit...</div>';

  try {
    const select = [
      "id",
      "card_id",
      "plate_number",
      "container_num",
      "activity_type",
      "vendor",
      "client_id",
      "driver_name",
      "driver_phone",
      "truck_type",
      "shipment_type",
      "destination_city",
      "container_num",
      "notes",
      "driver_phone",
      "truck_type",
      "license_type",
      "license_num",
      "license_exp",
      "vehicle_exp",
      "vehicle_inspect_exp",
      "shipment_type",
      "shipment_number",
      "destination_city",
      "gate_id",
      "line_number_id",
      "seal_number",
      "notes",
      "process_status",
      "final_status",
      "wh_in_at",
      "registered_at",
      "started_at",
      "completed_at",
      "wh_out_at",
      "created_at",
      "updated_at",
      "cards(card_number)",
      
      "clients(name)",
      "gates(gate_number)",
      "line_numbers(line_number)",
      "photos(id,photo_type,file_location,created_at)"
    ].join(",");

    const url = SUPABASE_URL +
      "/rest/v1/visits?select=" + encodeURIComponent(select) +
      "&id=eq." + encodeURIComponent(visitId) +
      "&limit=1";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: "Bearer " + trcmSession.access_token
      }
    });

    const responseText = await response.text();
    let data = {};

    try {
      data = responseText ? JSON.parse(responseText) : {};
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(data && data.message ? data.message : "Gagal mengambil detail visit.");
    }

    if (!Array.isArray(data) || !data.length) {
      throw new Error("Visit tidak ditemukan.");
    }

    const visit = data[0];
    const card = visit.cards && visit.cards.card_number;
    const client = (visit.clients && visit.clients.name) || "—";
    const gate = visit.gates && visit.gates.gate_number;
    const lineNumber = visit.line_numbers && visit.line_numbers.line_number;

    visitModalTitle.textContent = visit.plate_number || "Detail visit";
    visitModalSubtitle.textContent =
      (visit.driver_name || "Driver tidak tersedia") + " · " +
      (client || "Client tidak tersedia");

    const general = [
      renderDetailItem("ID visit", visit.id, true),
      renderDetailItem("Nomor kartu", card, true),
      renderDetailItem("Plat nomor", visit.plate_number, true),
      renderDetailItem("Nomor kontainer", visit.container_num, true),
      renderDetailItem("Tipe Aktivitas", visit.activity_type === "inbound" ? "Inbound" : visit.activity_type === "outbound" ? "Outbound" : visit.activity_type),
      renderDetailItem("Klien", client),
      renderDetailItem("Nama sopir", visit.driver_name),
      renderDetailItem("Nomor telepon sopir", visit.driver_phone, true),
      renderDetailItem("Tipe truck", visit.truck_type)
    ].join("");

    const documents = [
      renderDetailItem("Tipe SIM", visit.license_type),
      renderDetailItem("Nomor SIM", visit.license_num, true),
      renderDetailItem("Masa berlaku SIM", visit.license_exp),
      renderDetailItem("Masa berlaku kendaraan", visit.vehicle_exp),
      renderDetailItem("Masa berlaku inspeksi kendaraan", visit.vehicle_inspect_exp),
      renderDetailItem("Tipe shipment", visit.shipment_type),
      renderDetailItem("Nomor shipment", visit.shipment_number, true),
      renderDetailItem("Tujuan (Gudang / Kota)", visit.destination_city, true),
      renderDetailItem("Nomor gerbang", gate),
      renderDetailItem("Nomor line", lineNumber),
      renderDetailItem("Nomor segel", visit.seal_number, true),
      renderDetailItem("Status proses", statusLabel(visit.process_status)),
      renderDetailItem("Status akhir", statusLabel(visit.final_status))
    ].join("");

    const times = [
      renderDetailItem("WH In", formatDateTime(visit.wh_in_at), true),
      renderDetailItem("Terdaftar", formatDateTime(visit.registered_at), true),
      renderDetailItem("Mulai", formatDateTime(visit.started_at), true),
      renderDetailItem("Selesai", formatDateTime(visit.completed_at), true),
      renderDetailItem("WH Out", formatDateTime(visit.wh_out_at), true),
      renderDetailItem("Dibuat", formatDateTime(visit.created_at), true),
      renderDetailItem("Diperbarui", formatDateTime(visit.updated_at), true),
      renderDetailItem("Catatan", visit.notes)
    ].join("");

    const photos = Array.isArray(visit.photos) ? visit.photos : [];
    const photoHtml = photos.length

            '</span><span class="photo-location">' +
            escapeHtml(photo.file_location) +

            escapeHtml(formatDateTime(photo.created_at)) +
            "</span></div>";
        }).join("")
      : '<div class="modal-empty">Belum ada foto yang tercatat untuk visit ini.</div>';

    visitModalBody.innerHTML =

function renderTable() {
  const rows = filteredVisits();
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  currentPage = Math.min(currentPage, totalPages);
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageRows = rows.slice(start, start + PAGE_SIZE);
  resultCount.textContent = rows.length + " pendaftaran";
  renderPagination(rows.length, totalPages);

  if (!pageRows.length) {
    truckTable.innerHTML = '<tr><td colspan="6" class="table-state">Tidak ada data yang sesuai dengan filter.</td></tr>';
    return;
  }

  truckTable.innerHTML = pageRows.map(function (visit) {
    const destination = visit.activity_type === "inbound" ? "Inbound" : visit.activity_type === "outbound" ? "Outbound" : "—";
    const status = statusLabels[visit.process_status] || visit.process_status || "—";
    const client = visit.client || (visit.clients && visit.clients.name) || "—";
    const secondary = visit.driver_name || visit.driver || client;
    return '<tr>' +
      '<td><span class="table-card-number">' + escapeHtml((visit.cards && visit.cards.card_number) || visit.card_number || "—") + '</span></td>' +
      '<td><span class="plate">' + escapeHtml(visit.plate_number) + '</span><span class="table-subline">' + escapeHtml(secondary) + '</span></td>' +
      '<td><span class="destination ' + (visit.activity_type === "inbound" ? "destination-inbound" : visit.activity_type === "outbound" ? "destination-outbound" : "") + '">' + escapeHtml(destination) + '</span></td>' +
      '<td>' + escapeHtml(visit.vendor || "—") + '</td>' +
      '<td>' + (window.trcmStatusBadge ? window.trcmStatusBadge(visit.process_status) : '<span class="status-badge status-unknown"><span class="status-dot"></span>' + escapeHtml(status) + '</span>') + '</td>' +
      '<td><span class="duration">' + escapeHtml(formatTime(visit.wh_in_at || visit.registered_at || visit.created_at)) + '</span></td>' +
      '<td class="action-cell">' +
        '<button class="detail-button me-1" type="button" data-visit-id="' + escapeHtml(visit.id) + '"><i class="bi bi-arrow-up-right-square"></i><span>Detail</span></button>' +
        (canManageVisits
          ? '<button class="action-button me-1" type="button" title="Edit data kunjungan" aria-label="Edit data kunjungan" data-edit-visit-id="' + escapeHtml(visit.id) + '"><i class="bi bi-pencil-square"></i></button>' +
            '<button class="action-button action-button-danger" type="button" title="Hapus kunjungan" aria-label="Hapus kunjungan" data-delete-visit-id="' + escapeHtml(visit.id) + '"><i class="bi bi-trash3"></i></button>'
          : '') +
      '</td></tr>';
  }).join("");

  truckTable.querySelectorAll("[data-visit-id]").forEach(function (button) {
    button.addEventListener("click", function () {
      openVisitDetail(button.getAttribute("data-visit-id"));
    });
  });
}

function renderPagination(totalRows, totalPages) {
  const controls = document.getElementById("pagination-controls");
  const summary = document.getElementById("pagination-summary");
  if (!controls || !summary) return;
  if (!totalRows) {
    summary.textContent = "";
    controls.innerHTML = "";
    return;
  }
  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, totalRows);
  summary.textContent = "Menampilkan " + start + "–" + end + " dari " + totalRows + " pendaftaran";

  const items = [];
  const addPage = function(page, label, disabled, active) {
    items.push('<li class="page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : '') + '"><button class="page-link" type="button" data-page="' + page + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button></li>');
  };
  addPage(currentPage - 1, '<i class="bi bi-chevron-left"></i>', currentPage === 1, false);
  for (let page = 1; page <= totalPages; page += 1) {
    if (totalPages > 7 && page > 3 && page < totalPages - 2 && Math.abs(page - currentPage) > 1) {
      if (!items.some(item => item.includes('pagination-ellipsis'))) {
        items.push('<li class="page-item pagination-ellipsis disabled"><span class="page-link">…</span></li>');
      }
      continue;
    }
    addPage(page, String(page), false, page === currentPage);
  }
  addPage(currentPage + 1, '<i class="bi bi-chevron-right"></i>', currentPage === totalPages, false);
  controls.innerHTML = items.join("");
  controls.querySelectorAll("[data-page]").forEach(function (button) {
    button.addEventListener("click", function () {
      currentPage = Number(button.getAttribute("data-page"));
      renderTable();
    });
  });
}
function renderStats() {}

async function loadVisits() {
  truckTable.innerHTML =
    '<tr><td colspan="7" class="table-state">Memuat data truk...</td></tr>';
  resultCount.textContent = "Memuat data...";
  refreshButton.disabled = true;

  try {
    const select = [
      "id",
      "plate_number",
      "container_num",
      "activity_type",
      "vendor",
      "client_id",
      "driver_name",
      "shipment_number",
      "process_status",
      "final_status",
      "wh_in_at",
      "registered_at",
      "started_at",
      "completed_at",
      "created_at",
      "cards(card_number)",
      "clients(name)",
      "gates(gate_number)"
    ].join(",");

    const url =
      SUPABASE_URL +
      "/rest/v1/visits?select=" +
      encodeURIComponent(select) +
      "&order=created_at.desc";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: "Bearer " + trcmSession.access_token
      }
    });

    const responseText = await response.text();
    let data = {};

    try {
      data = responseText ? JSON.parse(responseText) : {};
    } catch {
      data = {};
    }

    if (response.status === 401) {
      sessionStorage.removeItem("trcm_session");
      window.location.replace("../index.html");
      return;
    }

    if (!response.ok) {
      const message = data && data.message ? data.message : "Gagal mengambil data dashboard.";
      throw new Error(message);
    }

    if (!Array.isArray(data)) {
      throw new Error("Respons data dashboard tidak valid.");
    }

    visits = data;
    renderKlienOptions();
    renderStats();
    renderTable();
  } catch (error) {
    console.error("TRCM dashboard:", error);
    truckTable.innerHTML =
      '<tr><td colspan="7" class="table-state error-state">Data dashboard gagal dimuat. Silakan perbarui.</td></tr>';
    resultCount.textContent = "Gagal memuat data";
  } finally {
    refreshButton.disabled = false;
  }
}

[filterClient, filterPlate, filterCard, filterDate].forEach(
  function (element) {
    element.addEventListener("input", renderTable);
    element.addEventListener("change", renderTable);
  }
);

truckTable.addEventListener("click", async function (event) {
  const detailButton = event.target.closest(".detail-button");
  const editButton = event.target.closest("[data-edit-visit-id]");
  const deleteButton = event.target.closest("[data-delete-visit-id]");

  if (detailButton) {
    openVisitModal(detailButton.dataset.visitId);
    return;
  }

  if (editButton && canManageVisits) {
    const visit = visits.find(function (item) { return item.id === editButton.dataset.editVisitId; });
    if (visit) openEditModal(visit);
    return;
  }

  if (deleteButton && canManageVisits) {
    const visit = visits.find(function (item) { return item.id === deleteButton.dataset.deleteVisitId; });
    if (!visit) return;
    const confirmation = await Swal.fire({
      icon: "warning",
      title: "Hapus kunjungan?",
      html: "Data kunjungan <strong>" + escapeHtml(visit.plate_number || "ini") + "</strong> akan dihapus.",
      showCancelButton: true,
      confirmButtonText: "Ya, hapus",
      cancelButtonText: "Batal",
      confirmButtonColor: "#dc3545"
    });
    if (!confirmation.isConfirmed) return;
    try {
      deleteButton.disabled = true;
      await deleteVisit(visit.id);
      await Swal.fire({
        icon: "success",
        title: "Berhasil dihapus",
        text: "Data kunjungan sudah dihapus.",
        confirmButtonText: "Selesai",
        confirmButtonColor: "#0066B3"
      });
      await loadVisits();
    } catch (error) {
      await Swal.fire({
        icon: "error",
        title: "Gagal menghapus",
        text: error.message || "Data kunjungan tidak berhasil dihapus.",
        confirmButtonText: "Tutup",
        confirmButtonColor: "#0066B3"
      });
      deleteButton.disabled = false;
    }
  }
});

visitModalClose.addEventListener("click", closeVisitModal);
visitModalBackdrop.addEventListener("click", function (event) {
  if (event.target === visitModalBackdrop) {
    closeVisitModal();
  }
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && visitModalBackdrop.classList.contains("is-visible")) {
    closeVisitModal();
  }
});

resetFilter.addEventListener("click", function () {
  currentPage = 1;
  filterClient.value = "";
  filterPlate.value = "";
  filterCard.value = "";
  filterDate.value = "";
  renderTable();
});

editForm.addEventListener("submit", async function (event) {
  event.preventDefault();
  clearEditAlert();
  if (!editForm.checkValidity()) {
    editForm.classList.add("was-validated");
    return;
  }

  const visitId = document.getElementById("edit-visit-id").value;
  const saveLabel = editSaveButton.innerHTML;
  editSaveButton.disabled = true;
  editSaveButton.innerHTML = '<span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>Menyimpan...';

  const payload = {
    plate_number: document.getElementById("edit-plate-number").value.trim().toUpperCase(),
    activity_type: document.getElementById("edit-activity-type").value,
    vendor: document.getElementById("edit-vendor").value.trim(),
    client_id: document.getElementById("edit-client").value || null,
    driver_name: document.getElementById("edit-driver-name").value.trim(),
    driver_phone: document.getElementById("edit-driver-phone").value.trim() || null,
    truck_type: document.getElementById("edit-truck-type").value.trim() || null,
    container_num: document.getElementById("edit-container-num").value.trim() || null,
    shipment_type: document.getElementById("edit-shipment-type").value || null,
    shipment_number: document.getElementById("edit-shipment-number").value.trim() || null,
    destination_city: document.getElementById("edit-destination-city").value.trim(),
    notes: document.getElementById("edit-notes").value.trim() || null
  };

  try {
    await patchVisit(visitId, payload);
    editModal.hide();
    await Swal.fire({
      icon: "success",
      title: "Perubahan tersimpan",
      text: "Data kunjungan berhasil diperbarui.",
      confirmButtonText: "Selesai",
      confirmButtonColor: "#0066B3"
    });
    await loadVisits();
  } catch (error) {
    showEditAlert(error.message || "Data kunjungan gagal diperbarui.", "danger");
  } finally {
    editSaveButton.disabled = false;
    editSaveButton.innerHTML = saveLabel;
  }
});

refreshButton.addEventListener("click", loadVisits);



exportButton.addEventListener("click", function () {
  exportButton.disabled = true;
  exportButton.classList.add("is-exporting");
  const rows = filteredVisits();
  const header = [
    "Nomor kartu",
    "Plat nomor",
    "Tipe Aktivitas",
    "Klien",
    "Vendor",
    "Nomor shipment",
    "Gerbang",
    "Status",
    "Waktu di gudang"
  ];

  const csvRows = rows.map(function (visit) {
    const destination =
      visit.activity_type === "inbound" ? "Inbound" : "Outbound";
    const status = statusLabels[visit.process_status] || visit.process_status || "";
    const cardNumber = (visit.cards && visit.cards.card_number) || visit.card_number || "";
    const duration =
      visit.process_status === "completed"
        ? formatDuration(visit.wh_in_at, visit.completed_at)
        : formatDuration(visit.wh_in_at, new Date().toISOString());

    return [
      cardNumber,
      visit.plate_number || "",
      destination,
      (visit.clients && visit.clients.name) || "",
      visit.vendor || "",
      visit.shipment_number || "",
      visit.gates && visit.gates.gate_number ? visit.gates.gate_number : "",
      status,
      duration
    ];
  });

  const csv = [header, ...csvRows]
    .map(function (row) {
      return row
        .map(function (value) {
          return '"' + String(value).replace(/"/g, '""') + '"';
        })
        .join(",");
    })
    .join("\r\n");

  const blob = new Blob(["\ufeff" + csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");

  anchor.href = url;
  anchor.download =
    "trcm-dashboard-" + new Date().toISOString().slice(0, 10) + ".csv";

  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  URL.revokeObjectURL(url);
  exportButton.disabled = false;
  exportButton.classList.remove("is-exporting");
});

loadVisits();
});
</script>
