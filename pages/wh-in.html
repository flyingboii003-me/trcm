<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TRCM - WH In Gate Security"><title>WH In — TRCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" href="../assets/css/trcm.css">
</head>
<body class="trcm-app" data-page-resource="wh_in">
<div class="app-layout"><div id="sidebar-container"></div><div class="main-wrapper"><div id="topbar-container"></div><main class="content-wrapper"><div class="container-fluid px-0">
  <div class="page-header"><div><h1 class="page-title">WH In</h1><p class="page-subtitle">Periksa armada yang sudah diregistrasi, lalu konfirmasi saat armada memenuhi checklist driver.</p></div>
  <button class="btn btn-date-picker" id="page-refresh-button" type="button"><i class="bi bi-arrow-clockwise"></i><span>Perbarui</span></button></div>
  <section class="card content-card"><div class="card-header content-card-header"><div><h2 class="card-title">Armada menunggu konfirmasi WH In</h2><p id="result-count" class="page-subtitle">Memuat data...</p></div></div>
    <div class="card-body p-0"><div class="p-3 p-lg-4 border-bottom"><div class="row g-2"><div class="col-12 col-md-8"><label class="visually-hidden" for="search-card">Cari kartu, plat nomor, atau driver</label><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="search-card" type="search" placeholder="Cari kartu, plat nomor, atau driver..."></div></div>
    <div class="col-12 col-md-4"><button class="btn btn-light border w-100" id="reset-search" type="button"><i class="bi bi-arrow-counterclockwise me-1"></i>Reset</button></div></div></div>
    <div class="table-responsive"><table class="table table-hover align-middle trcm-table mb-0"><thead><tr><th>Kartu</th><th>Plat nomor</th><th>Driver</th><th>Jenis truck</th><th>Klien</th><th>Tipe Aktivitas</th><th>Waktu registrasi</th><th>Status</th><th class="action-column">Aksi</th></tr></thead>
    <tbody id="wh-in-table"><tr><td colspan="9" class="table-state">Memuat data armada...</td></tr></tbody></table></div></div></section>
</div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="../assets/js/config.js"></script><script src="../assets/js/components.js"></script>
<script>
window.trcmComponentsReady.then(async function () {
  "use strict";
  const session=getTrcmSession();
  if(!session||!session.access_token||!session.user){window.location.replace("../index.html");return;}
  const canConfirm=window.trcmPermissions.can("wh_in","update"),table=document.getElementById("wh-in-table"),count=document.getElementById("result-count"),search=document.getElementById("search-card"),reset=document.getElementById("reset-search"),refresh=document.getElementById("page-refresh-button");
  let visits=[];
  function dateTime(value){if(!value)return "—";const d=new Date(value);return Number.isNaN(d.getTime())?"—":new Intl.DateTimeFormat("id-ID",{dateStyle:"medium",timeStyle:"short"}).format(d);}
  function activity(value){return value==="inbound"?"Inbound":value==="outbound"?"Outbound":value||"—";}
  async function request(path,options){const response=await fetch(SUPABASE_URL+path,Object.assign({headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+session.access_token}},options||{}));const text=await response.text();let data=null;try{data=text?JSON.parse(text):null;}catch{}if(response.status===401){sessionStorage.removeItem("trcm_session");window.location.replace("../index.html");return null;}if(!response.ok)throw new Error(data&&(data.message||data.details||data.hint)?(data.message||data.details||data.hint):"Permintaan ke database gagal.");return data;}
  function render(){const needle=search.value.trim().toLowerCase(),filtered=visits.filter(v=>{const card=v.cards&&v.cards.card_number||"";return !needle||card.toLowerCase().includes(needle)||String(v.plate_number||"").toLowerCase().includes(needle)||String(v.driver_name||"").toLowerCase().includes(needle);});count.textContent=filtered.length+" armada menunggu konfirmasi WH In";if(!filtered.length){table.innerHTML='<tr><td colspan="9" class="table-state">Tidak ada armada yang menunggu konfirmasi WH In.</td></tr>';return;}table.innerHTML=filtered.map(v=>{const card=v.cards&&v.cards.card_number||"—",client=v.clients&&v.clients.name||"—";return '<tr><td><span class="table-card-number">'+escapeHtml(card)+'</span></td><td class="font-monospace fw-semibold">'+escapeHtml(v.plate_number||"—")+'</td><td>'+escapeHtml(v.driver_name||"—")+'</td><td>'+escapeHtml(v.truck_type||"—")+'</td><td>'+escapeHtml(client)+'</td><td>'+escapeHtml(activity(v.activity_type))+'</td><td><span class="font-monospace">'+escapeHtml(dateTime(v.registered_at))+'</span></td><td>'+window.trcmStatusBadge(v.process_status||"wh_in")+'</td><td class="action-cell"><button type="button" class="btn btn-primary btn-sm wh-in-button" data-visit-id="'+escapeHtml(v.id)+'"'+(canConfirm?"":" disabled")+'><i class="bi bi-box-arrow-in-down me-1"></i>Konfirmasi WH In</button></td></tr>';}).join("");}
  async function loadVisits(){table.innerHTML='<tr><td colspan="9" class="table-state">Memuat data armada...</td></tr>';count.textContent="Memuat data...";refresh.disabled=true;try{const select=["id","plate_number","driver_name","driver_phone","truck_type","license_type","license_num","license_exp","vehicle_exp","vehicle_inspect_exp","container_num","activity_type","vendor","registered_at","wh_in_at","process_status","cards(card_number)","clients(name)"].join(",");const path="/rest/v1/visits?select="+encodeURIComponent(select)+"&process_status=eq.wh_in&wh_in_at=is.null&registered_at=not.is.null&order=registered_at.asc";const data=await request(path);if(!Array.isArray(data))throw new Error("Respons data WH In tidak valid.");visits=data;render();}catch(error){console.error("TRCM WH In:",error);table.innerHTML='<tr><td colspan="9" class="table-state error-state">Data WH In gagal dimuat. Silakan perbarui.</td></tr>';count.textContent="Gagal memuat data";await Swal.fire({icon:"error",title:"Gagal memuat WH In",text:error.message||"Data armada tidak dapat dimuat.",confirmButtonText:"Tutup",confirmButtonColor:"#0066B3"});}finally{refresh.disabled=false;}}
  async function confirmWhIn(v){if(!canConfirm||!v)return;const card=v.cards&&v.cards.card_number||"—",client=v.clients&&v.clients.name||"—";const rows=[["Nomor kartu",card],["Plat nomor",v.plate_number||"—"],["Nama driver",v.driver_name||"—"],["Nomor telepon driver",v.driver_phone||"—"],["Jenis truck",v.truck_type||"—"],["Nomor kontainer",v.container_num||"—"],["Tipe SIM",v.license_type||"—"],["Nomor SIM",v.license_num||"—"],["Masa berlaku SIM",v.license_exp||"—"],["Masa berlaku kendaraan",v.vehicle_exp||"—"],["Masa berlaku KIR",v.vehicle_inspect_exp||"—"],["Vendor",v.vendor||"—"],["Klien",client],["Tipe aktivitas",activity(v.activity_type)]];const details='<div class="text-start"><div class="table-responsive"><table class="table table-sm align-middle mb-3"><tbody>'+rows.map(r=>'<tr><th class="text-body-secondary fw-medium" style="width:42%">'+escapeHtml(r[0])+'</th><td class="fw-semibold">'+escapeHtml(r[1])+'</td></tr>').join("")+'</tbody></table></div></div>';
    const result=await Swal.fire({icon:"question",title:"Konfirmasi WH In",html:details,input:"checkbox",inputValue:0,inputPlaceholder:"Armada sudah memenuhi checklist driver",inputValidator:value=>value===1?undefined:"Checklist wajib dicentang sebelum konfirmasi WH In.",showCancelButton:true,confirmButtonText:"Konfirmasi WH In",cancelButtonText:"Batal",confirmButtonColor:"#0066CD",reverseButtons:true});if(!result.isConfirmed)return;
    const button=table.querySelector('[data-visit-id="'+CSS.escape(v.id)+'"]');if(button)button.disabled=true;const stamp=new Date().toISOString();
    try{const updated=await request("/rest/v1/visits?id=eq."+encodeURIComponent(v.id)+"&process_status=eq.wh_in&wh_in_at=is.null",{method:"PATCH",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",Prefer:"return=representation"},body:JSON.stringify({wh_in_at:stamp})});if(!Array.isArray(updated)||updated.length!==1)throw new Error("Armada sudah berubah status atau sudah dikonfirmasi WH In oleh pengguna lain.");
      try{await request("/rest/v1/visit_events",{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({visit_id:v.id,status:"wh_in",user_id:session.user.id})});}catch(eventError){try{await request("/rest/v1/visits?id=eq."+encodeURIComponent(v.id)+"&wh_in_at=eq."+encodeURIComponent(stamp),{method:"PATCH",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({wh_in_at:null})});}catch(rollbackError){console.error("TRCM WH In rollback:",rollbackError);}throw eventError;}
      await Swal.fire({icon:"success",title:"WH In berhasil",html:'Armada <strong>'+escapeHtml(card)+'</strong> · <strong>'+escapeHtml(v.plate_number||"—")+'</strong> sudah dikonfirmasi dan berstatus Terdaftar.',confirmButtonText:"Selesai",confirmButtonColor:"#0066B3"});await loadVisits();
    }catch(error){await Swal.fire({icon:"error",title:"Konfirmasi WH In gagal",text:error.message||"Status WH In tidak berhasil disimpan.",confirmButtonText:"Tutup",confirmButtonColor:"#0066B3"});render();}}
  search.addEventListener("input",render);reset.addEventListener("click",()=>{search.value="";render();});refresh.addEventListener("click",()=>window.trcmRunRefresh(refresh,loadVisits));table.addEventListener("click",event=>{const button=event.target.closest(".wh-in-button");if(!button||!canConfirm)return;const visit=visits.find(v=>v.id===button.dataset.visitId);if(visit)confirmWhIn(visit);});
  if(!canConfirm)await Swal.fire({icon:"error",title:"Akses terbatas",text:"Konfirmasi WH In hanya dapat dilakukan oleh Gate Security atau Admin.",confirmButtonText:"Tutup",confirmButtonColor:"#0066B3"});
  window.trcmRegisterRefresh(loadVisits);await loadVisits();
});
</script></body></html>
