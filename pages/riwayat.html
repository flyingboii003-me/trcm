<script>
window.trcmComponentsReady.then(async function () {

const visitModalBackdrop = document.getElementById("visit-modal-backdrop");
const visitModal = document.getElementById("visit-modal");
const visitModalClose = document.getElementById("visit-modal-close");
const visitModalCloseTop = document.getElementById("visit-modal-close-top");
const visitModalTitle = document.getElementById("visit-modal-title");
const visitModalSubtitle = document.getElementById("visit-modal-subtitle");
const visitModalBody = document.getElementById("visit-modal-body");

let trcmSession = null;
trcmSession = getTrcmSession();

if (!trcmSession || !trcmSession.access_token || !trcmSession.user) {
  window.location.replace("../index.html");
} else {
  // Account and sidebar state are handled by the shared component module.
}


const truckTable = document.getElementById("truck-table");
const resultCount = document.getElementById("result-count");
const editModalElement = document.getElementById("visit-edit-modal");
const editModal = new bootstrap.Modal(editModalElement);
const editForm = document.getElementById("visit-edit-form");
const editAlert = document.getElementById("visit-edit-alert");
const editSaveButton = document.getElementById("edit-save-button");
const canManageVisits = Boolean(trcmSession.user && (trcmSession.user.role === "gatesec" || trcmSession.user.role === "admin") && window.trcmPermissions && window.trcmPermissions.can("history", "update"));
const filterClient = document.getElementById("filter-client");
const filterPlate = document.getElementById("filter-plate");
const filterCard = document.getElementById("filter-card");
const filterDate = document.getElementById("filter-date");
const resetFilter = document.getElementById("reset-filter");
const refreshButton = document.getElementById("page-refresh-button");
const exportButton = document.getElementById("export-button");

let visits = [];
const PAGE_SIZE = 10;
let currentPage = 1;

const statusLabels = window.trcmStatusLabels || {};

function showEditAlert(message, type) {
  editAlert.className = "alert alert-" + type;
  editAlert.textContent = message;
}

function clearEditAlert() {
  editAlert.className = "alert d-none";
  editAlert.textContent = "";
}

async function patchVisit(visitId, payload) {
  const response = await fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + encodeURIComponent(visitId), {
    method: "PATCH",
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: "Bearer " + trcmSession.access_token,
      "Content-Type": "application/json",
      Prefer: "return=representation"
    },
    body: JSON.stringify(payload)
  });
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = null; }
  if (response.status === 401) {
    sessionStorage.removeItem("trcm_session");
    window.location.replace("../index.html");
    return null;
  }
  if (!response.ok) {
    throw new Error(data && (data.message || data.details || data.hint) ? (data.message || data.details || data.hint) : "Data kunjungan gagal diperbarui.");
  }
  return data;
}

async function deleteVisit(visitId) {
  const response = await fetch(SUPABASE_URL + "/rest/v1/visits?id=eq." + encodeURIComponent(visitId), {
    method: "DELETE",
    headers: {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: "Bearer " + trcmSession.access_token,
      Prefer: "return=minimal"
    }
  });
  const text = await response.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = null; }
  if (response.status === 401) {
    sessionStorage.removeItem("trcm_session");
    window.location.replace("../index.html");
    return;
  }
  if (!response.ok) {
    throw new Error(data && (data.message || data.details || data.hint) ? (data.message || data.details || data.hint) : "Data kunjungan gagal dihapus.");
  }
}

function populateEditClients(selectedId) {
  const names = [];
  visits.forEach(function (visit) {
    const clientId = visit.client_id;
    const clientName = visit.client || (visit.clients && visit.clients.name);
    if (clientId && clientName && !names.some(function (item) { return item.id === clientId; })) {
      names.push({ id: clientId, name: clientName });
    }
  });
  const editClient = document.getElementById("edit-client");
  editClient.innerHTML = '<option value="">Pilih klien</option>' + names.sort(function (a, b) {
    return a.name.localeCompare(b.name, "id");
  }).map(function (item) {
    return '<option value="' + escapeHtml(item.id) + '">' + escapeHtml(item.name) + '</option>';
  }).join("");
  editClient.value = selectedId || "";
}

function openEditModal(visit) {
  if (!canManageVisits) return;
  clearEditAlert();
  editForm.classList.remove("was-validated");
  document.getElementById("edit-visit-id").value = visit.id;
  document.getElementById("edit-plate-number").value = visit.plate_number || "";
  document.getElementById("edit-activity-type").value = visit.activity_type || "";
  document.getElementById("edit-vendor").value = visit.vendor || "";
  document.getElementById("edit-driver-name").value = visit.driver_name || "";
  document.getElementById("edit-driver-phone").value = visit.driver_phone || "";
  document.getElementById("edit-truck-type").value = visit.truck_type || "";
  document.getElementById("edit-container-num").value = visit.container_num || "";
  document.getElementById("edit-destination-city").value = visit.destination_city || "";
  document.getElementById("edit-notes").value = visit.notes || "";
  populateEditClients(visit.client_id);
  editModal.show();
}

function formatDuration(start, end) {
  if (!start || !end) {
    return "—";
  }

  const startTime = new Date(start);
  const endTime = new Date(end);

  if (Number.isNaN(startTime.getTime()) || Number.isNaN(endTime.getTime())) {
    return "—";
  }

  const minutes = Math.max(0, Math.round((endTime - startTime) / 60000));
  const hours = Math.floor(minutes / 60);
  const remainingMinutes = minutes % 60;

  if (hours > 0) {
    return hours + "j " + String(remainingMinutes).padStart(2, "0") + "m";
  }

  return remainingMinutes + "m";
}

function formatTime(value) {
  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return new Intl.DateTimeFormat("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function renderKlienOptions() {
  const names = Array.from(
    new Set(
      visits
        .map(function (visit) {
          return visit.client || (visit.clients && visit.clients.name);
        })
        .filter(Boolean)
    )
  ).sort(function (a, b) {
    return a.localeCompare(b, "id");
  });

  filterClient.innerHTML =
    '<option value="">Semua klien</option>' +
    names
      .map(function (name) {
        return '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + "</option>";
      })
      .join("");
}

function getVisitDate(visit) {
  return visit.wh_in_at || visit.created_at || null;
}

function filteredVisits() {
  const plate = filterPlate.value.trim().toLowerCase();
  const client = filterClient.value;
  const card = filterCard.value.trim().toLowerCase();
  const date = filterDate.value;

  return visits.filter(function (visit) {
    const visitPlate = String(visit.plate_number || "").toLowerCase();
    const visitDate = getVisitDate(visit);

    return (
      (!plate || visitPlate.includes(plate)) &&
      (!client || (visit.client || (visit.clients && visit.clients.name)) === client) &&
      (!card || String((visit.cards && visit.cards.card_number) || visit.card_number || "").toLowerCase().includes(card)) &&
      (!date || String(visitDate).slice(0, 10) === date)
    );
  });
}

function formatDateTime(value) {
  if (!value) {
    return "—";
  }

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return new Intl.DateTimeFormat("id-ID", {
    dateStyle: "medium",
    timeStyle: "short"
  }).format(date);
}

function displayValue(value) {
  return value === null || value === undefined || value === "" ? "—" : String(value);
}

function photoTypeLabel(type) {
  const labels = {
    seal_initial: "Seal awal",
    seal_final: "Seal akhir",
    registration: "Dokumentasi registrasi",
    loading_completion: "Foto loading"
  };

  return labels[type] || displayValue(type);
}

function statusLabel(value) {
  return (window.trcmStatusLabels && window.trcmStatusLabels[value]) || displayValue(value);
}

function renderDetailItem(label, value, mono) {
  return '<div class="detail-item"><span class="detail-label">' +
    escapeHtml(label) + '</span><span class="detail-value' +
    (mono ? ' mono' : '') + '">' + escapeHtml(displayValue(value)) +
    "</span></div>";
}

function closeVisitModal() {
  visitModalBackdrop.classList.remove("is-visible");
  visitModalBackdrop.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
}

async function openVisitModal(visitId) {
  visitModalBackdrop.classList.add("is-visible");
  visitModalBackdrop.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  visitModalTitle.textContent = "Memuat...";
  visitModalSubtitle.textContent = "";
  visitModalBody.innerHTML = '<div class="modal-loading">Memuat detail visit...</div>';

  try {
    const select = [
      "id",
      "card_id",
      "plate_number",
      "destination_city",
      "container_num",
      "activity_type",
      "vendor",
      "client_id",
      "driver_name",
      "driver_phone",
      "truck_type",
      "shipment_type",
      "destination_city",
      "container_num",
      "notes",
      "driver_phone",
      "truck_type",
      "license_type",
      "license_num",
      "license_exp",
      "vehicle_exp",
      "vehicle_inspect_exp",
      "shipment_type",
      "shipment_number",
      "destination_city",
      "gate_id",
      "line_number_id",
      "seal_number",
      "notes",
      "process_status",
      "final_status",
      "wh_in_at",
      "registered_at",
      "started_at",
      "completed_at",
      "wh_out_at",
      "created_at",
      "updated_at",
      "cards(card_number)",
      
      "clients(name)",
      "gates(gate_number)",
      "line_numbers(line_number)",
      "photos(id,photo_type,file_location,created_at,uploaded_by,uploaded_by_user:users!photos_uploaded_by_fkey(username,full_name))"
    ].join(",");

    const url = SUPABASE_URL +
      "/rest/v1/visits?select=" + encodeURIComponent(select) +
      "&id=eq." + encodeURIComponent(visitId) +
      "&limit=1";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Authorization: "Bearer " + trcmSession.access_token
      }
    });

    const responseText = await response.text();
    let data = {};

    try {
      data = responseText ? JSON.parse(responseText) : {};
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(data && data.message ? data.message : "Gagal mengambil detail visit.");
    }

    if (!Array.isArray(data) || !data.length) {
      throw new Error("Visit tidak ditemukan.");
    }

    const visit = data[0];
    const card = visit.cards && visit.cards.card_number;
    const client = (visit.clients && visit.clients.name) || "—";
    const gate = visit.gates && visit.gates.gate_number;
    const lineNumber = visit.line_numbers && visit.line_numbers.line_number;
    let activityActors = [];
    try {
      const actorResponse = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_visit_event_actors", {
        method: "POST",
        headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: "Bearer " + trcmSession.access_token, "Content-Type": "application/json" },
        body: JSON.stringify({ p_visit_id: visit.id })
      });
      const actorRows = await actorResponse.json().catch(function () { return []; });
      if (actorResponse.ok && Array.isArray(actorRows)) activityActors = actorRows;
    } catch (actorError) { console.warn("TRCM visit actors:", actorError); }
    const actorHtml = activityActors.length
      ? '<div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Aktivitas</th><th>Checker / pengguna</th><th>Waktu</th></tr></thead><tbody>' + activityActors.map(function (row) {
          const labels = { wh_in: "WH In", registered: "Terdaftar", parked: "Antri/Parkir", processing: "Proses", started: "Mulai Loading", completed: "Selesai Loading", wh_out: "WH Out", cancelled: "Dibatalkan" };
          return '<tr><td>' + escapeHtml(labels[row.status] || row.status || "—") + '</td><td>' + escapeHtml(row.actor_display_name || "Pengguna") + '</td><td>' + escapeHtml(formatDateTime(row.created_at)) + '</td></tr>';
        }).join("") + '</tbody></table></div>'
      : '<div class="modal-empty">Belum ada data atribusi aktivitas.</div>';

    visitModalTitle.textContent = visit.plate_number || "Detail visit";
    visitModalSubtitle.textContent =
      (visit.driver_name || "Driver tidak tersedia") + " · " +
      (client || "Client tidak tersedia");

    const general = [
      renderDetailItem("ID visit", visit.id, true),
      renderDetailItem("Nomor kartu", card, true),
      renderDetailItem("Plat nomor", visit.plate_number, true),
      renderDetailItem("Nomor kontainer", visit.container_num, true),
      renderDetailItem("Tipe Aktivitas", visit.activity_type === "inbound" ? "Inbound" : visit.activity_type === "outbound" ? "Outbound" : visit.activity_type),
      renderDetailItem("Klien", client),
      renderDetailItem("Nama sopir", visit.driver_name),
      renderDetailItem("Nomor telepon sopir", visit.driver_phone, true),
      renderDetailItem("Tipe truck", visit.truck_type)
    ].join("");

    const documents = [
      renderDetailItem("Tipe SIM", visit.license_type),
      renderDetailItem("Nomor SIM", visit.license_num, true),
      renderDetailItem("Masa berlaku SIM", visit.license_exp),
      renderDetailItem("Masa berlaku kendaraan", visit.vehicle_exp),
      renderDetailItem("Masa berlaku inspeksi kendaraan", visit.vehicle_inspect_exp),
      renderDetailItem("Tipe shipment", visit.shipment_type),
      renderDetailItem("Nomor shipment", visit.shipment_number, true),
      renderDetailItem("Tujuan (Gudang / Kota)", visit.destination_city, true),
      renderDetailItem("Nomor gerbang", gate),
      renderDetailItem("Nomor line", lineNumber),
      renderDetailItem("Nomor segel", visit.seal_number, true),
      renderDetailItem("Status proses", statusLabel(visit.process_status)),
      renderDetailItem("Status akhir", statusLabel(visit.final_status))
    ].join("");

    let selectedPlanShipmentHtml = '<div class="modal-loading">Memuat DO/Shipment yang dipilih...</div>';
    try {
      const linkedItems = await fetch(SUPABASE_URL + "/rest/v1/visit_plan_items?select=plan_item_id,snapshot_do_number,snapshot_shipment_number,snapshot_trip_number,snapshot_vendor,snapshot_destination,snapshot_activity_type,import_plan_items(do_number,shipment_number,import_plans(activity_type),import_plan_trips(trip_number,vendor,destination))&visit_id=eq." + encodeURIComponent(visit.id), {
        headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: "Bearer " + trcmSession.access_token }
      });
      const linkedText = await linkedItems.text();
      let linkedRows = [];
      try { linkedRows = linkedText ? JSON.parse(linkedText) : []; } catch { linkedRows = []; }
      if (!linkedItems.ok) throw new Error("DO/Shipment tidak dapat dimuat.");
      if (Array.isArray(linkedRows) && linkedRows.length) {
        const references = new Map();
        const registrationVendor = String(visit.vendor || "").trim();
        const registrationDestination = String(visit.destination_city || "").trim();
        linkedRows.forEach(function (row) {
          const item = row.import_plan_items || {};
          const plan = item.import_plans || {};
          const activity = String(row.snapshot_activity_type || plan.activity_type || "").toLowerCase();
          const isInbound = activity === "inbound";
          const rawValue = isInbound
            ? (item.do_number || row.snapshot_do_number || "")
            : (item.shipment_number || row.snapshot_shipment_number || "");
          const labels = String(rawValue).split(",").map(function (value) { return value.trim(); }).filter(Boolean);
          const trip = item.import_plan_trips || {
            trip_number: row.snapshot_trip_number,
            vendor: row.snapshot_vendor,
            destination: row.snapshot_destination
          };
          labels.forEach(function (label) {
            const key = (isInbound ? "do:" : "shipment:") + label.toLocaleLowerCase("id-ID");
            if (!references.has(key)) references.set(key, {label:label,type:isInbound?"do":"shipment",trip:trip});
            const existing = references.get(key);
            if ((!existing.trip || (!existing.trip.vendor && !existing.trip.destination)) && trip) existing.trip = trip;
          });
        });
        function renderReferenceBadges(rawValue, referenceType) {
          const labels = String(rawValue || "").split(",").map(function (label) { return label.trim(); }).filter(Boolean);
          const uniqueLabels = labels.filter(function (label, index) {
            return labels.findIndex(function (candidate) { return candidate.toLocaleLowerCase("id-ID") === label.toLocaleLowerCase("id-ID"); }) === index;
          });
          if (!uniqueLabels.length) return '<span class="text-muted">—</span>';
          return '<div class="loading-shipment-list">' + uniqueLabels.map(function (label) {
            return '<span class="loading-shipment-chip loading-reference-' + referenceType + '" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</span>';

            '<td class="text-break">' + renderReferenceBadges(reference.type === "shipment" ? reference.label : "", "shipment") + '</td>' +

    }

    ].join("");

    const photos = Array.isArray(visit.photos) ? visit.photos : [];
    async function createSignedPhotoUrl(fileLocation) {
      if (!fileLocation) return null;

      const objectPath = String(fileLocation)
        .replace(/^\/+/g, "")
        .replace(/^trcm-visit-photos\//, "");

      if (!objectPath) return null;

      const response = await fetch(
        SUPABASE_URL + "/storage/v1/object/sign/trcm-visit-photos/" +
        objectPath.split("/").map(encodeURIComponent).join("/"),
        {
          method: "POST",
          headers: {
            apikey: SUPABASE_PUBLISHABLE_KEY,
            Authorization: "Bearer " + trcmSession.access_token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ expiresIn: 3600 })
        }
      );

      const responseText = await response.text();
      let data = null;
      try { data = responseText ? JSON.parse(responseText) : null; } catch {}

      if (!response.ok) {
        console.error("Gagal membuat signed URL foto:", response.status, data);
        return null;
      }

      const signedPath = data && (data.signedURL || data.signedUrl);
      if (!signedPath) return null;

      if (signedPath.startsWith("http://") || signedPath.startsWith("https://")) {
        return signedPath;
      }

      const normalizedSignedPath = signedPath.startsWith("/")
        ? signedPath
        : "/" + signedPath;

      return SUPABASE_URL + (
        normalizedSignedPath.startsWith("/storage/v1/")
          ? normalizedSignedPath
          : "/storage/v1" + normalizedSignedPath
      );
    }
    const photoResults = await Promise.all(photos.map(async function (photo) {

          }

        documents + "</div></section>" +

      '<section class="detail-section"><h3>Foto visit</h3><div class="photo-list">' +
        photoHtml + "</div></section>";
  } catch (error) {
    console.error("TRCM visit detail:", error);
    visitModalBody.innerHTML =
      '<div class="modal-error">' + escapeHtml(error.message || "Detail visit gagal dimuat.") + "</div>";
  }

function renderPagination(totalRows, totalPages) {
  const controls = document.getElementById("pagination-controls");
  const summary = document.getElementById("pagination-summary");
  if (!controls || !summary) return;
  if (!totalRows) {
    summary.textContent = "";
    controls.innerHTML = "";
    return;
  }
  const start = (currentPage - 1) * PAGE_SIZE + 1;
  const end = Math.min(currentPage * PAGE_SIZE, totalRows);
  summary.textContent = "Menampilkan " + start + "–" + end + " dari " + totalRows + " pendaftaran";

  const items = [];
  const addPage = function(page, label, disabled, active) {
    items.push('<li class="page-item' + (disabled ? ' disabled' : '') + (active ? ' active' : '') + '"><button class="page-link" type="button" data-page="' + page + '"' + (disabled ? ' disabled' : '') + '>' + label + '</button></li>');
  };
  addPage(currentPage - 1, '<i class="bi bi-chevron-left"></i>', currentPage === 1, false);
  for (let page = 1; page <= totalPages; page += 1) {
    if (totalPages > 7 && page > 3 && page < totalPages - 2 && Math.abs(page - currentPage) > 1) {
      if (!items.some(item => item.includes('pagination-ellipsis'))) {
        items.push('<li class="page-item pagination-ellipsis disabled"><span class="page-link">…</span></li>');
      }
      continue;
    }
    addPage(page, String(page), false, page === currentPage);
  }
  addPage(currentPage + 1, '<i class="bi bi-chevron-right"></i>', currentPage === totalPages, false);
  controls.innerHTML = items.join("");
  controls.querySelectorAll("[data-page]").forEach(function (button) {
    button.addEventListener("click", function () {
      currentPage = Number(button.getAttribute("data-page"));
      renderTable();
    });
  });
}

      }
    });

    const responseText = await response.text();

    }

    if (response.status === 401) {
      sessionStorage.removeItem("trcm_session");
      window.location.replace("../index.html");

    if (!response.ok) {
      const message = data && data.message ? data.message : "Gagal mengambil data dashboard.";

    if (!Array.isArray(data)) {
      throw new Error("Respons data dashboard tidak valid.");

function localDateKey(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Jakarta", year: "numeric", month: "2-digit", day: "2-digit"
  }).formatToParts(date).reduce(function (result, part) { result[part.type] = part.value; return result; }, {});
  return parts.year + "-" + parts.month + "-" + parts.day;
}
function elapsedMinutes(start, end) {
  if (!start || !end) return null;
  const startMs = new Date(start).getTime(), endMs = new Date(end).getTime();
  if (!Number.isFinite(startMs) || !Number.isFinite(endMs) || endMs < startMs) return null;
  return Math.round((endMs - startMs) / 60000);
}
function formatMinutes(minutes) {
  if (minutes === null || !Number.isFinite(minutes)) return "";
  return Math.floor(minutes / 60) + "j " + String(minutes % 60).padStart(2, "0") + "m";
}
function formatExportDate(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "";
  return new Intl.DateTimeFormat("id-ID", {
    timeZone: "Asia/Jakarta", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  }).format(date);
}
async function fetchExportVisits(startDate, endDate) {
  const select = [
    "id","plate_number","destination_city","container_num","activity_type","vendor","client_id",
    "driver_name","truck_type","shipment_type","shipment_number","gate_id","line_number_id",
    "seal_number","notes","started_at","completed_at","wh_in_at","wh_out_at","registered_at",
    "created_at","process_status","final_status","cards(card_number)","clients(name)",
    "gates(gate_number)","line_numbers(line_number)"
  ].join(",");
  const startIso = startDate + "T00:00:00+07:00";
  const end = new Date(endDate + "T00:00:00+07:00");
  end.setUTCDate(end.getUTCDate() + 1);
  const params = new URLSearchParams({select:select, and:"(wh_in_at.gte." + startIso + ",wh_in_at.lt." + end.toISOString() + ")", order:"wh_in_at.asc"});
  const allRows = [], pageSize = 1000;
  for (let offset = 0; ; offset += pageSize) {
    const response = await fetch(SUPABASE_URL + "/rest/v1/visits?" + params.toString(), {
      method:"GET",
      headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer " + trcmSession.access_token,
        Range:offset + "-" + (offset + pageSize - 1),"Range-Unit":"items"}
    });
    const responseText = await response.text();
    let data = null;
    try { data = responseText ? JSON.parse(responseText) : null; } catch { data = null; }
    if (response.status === 401) {
      sessionStorage.removeItem("trcm_session");
      window.location.replace("../index.html");
      throw new Error("Sesi berakhir. Silakan masuk kembali.");
    }
    if (!response.ok) throw new Error(data && (data.message || data.details || data.hint) || "Data ekspor gagal diambil.");
    if (!Array.isArray(data)) throw new Error("Respons data ekspor tidak valid.");
    allRows.push.apply(allRows,data);
    if (data.length < pageSize) break;
  }
  return allRows.filter(function (visit) {
    const day = localDateKey(visit.wh_in_at);
    return day && day >= startDate && day <= endDate;
  });
}

      "Tipe Truk":visit.truck_type || "", "Nomor Kontainer":visit.container_num || "",
      "Aktivitas":visit.activity_type === "inbound" ? "Inbound" : visit.activity_type === "outbound" ? "Outbound" : (visit.activity_type || ""),
      "Vendor":visit.vendor || "", "Klien":clientName(visit), "Tujuan":visit.destination_city || "",
      "Tipe Shipment":visit.shipment_type || "", "Nomor Shipment":visit.shipment_number || "",
      "Gerbang":gateName(visit), "Line":lineName(visit), "Nomor Seal":visit.seal_number || "",
      "Status Proses":statusLabel(visit.process_status), "Status Akhir":statusLabel(visit.final_status),
      "Catatan":visit.notes || "", "WH In":formatExportDate(visit.wh_in_at),
      "Registrasi":formatExportDate(visit.registered_at), "Mulai Loading":formatExportDate(visit.started_at),
      "Selesai Loading":formatExportDate(visit.completed_at), "WH Out":formatExportDate(visit.wh_out_at)
    };
  });
  const detailSheet = XLSX.utils.json_to_sheet(detailRows);
  detailSheet["!cols"] = [
    {wch:36},{wch:14},{wch:16},{wch:16},{wch:24},{wch:18},{wch:18},{wch:14},
    {wch:24},{wch:24},{wch:24},{wch:18},{wch:22},{wch:12},{wch:12},{wch:18},
    {wch:20},{wch:18},{wch:35},{wch:22},{wch:22},{wch:22},{wch:22},{wch:22}
  ];
  detailSheet["!autofilter"] = {ref:detailSheet["!ref"] || "A1"};
  detailSheet["!freeze"] = {xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(workbook,detailSheet,"Detail Kunjungan");

  const durationRows = rows.map(function (visit) {
    const stages = [
      ["WH In → Registrasi",visit.wh_in_at,visit.registered_at],
      ["Registrasi → Mulai Loading",visit.registered_at,visit.started_at],
      ["Mulai → Selesai Loading",visit.started_at,visit.completed_at],
      ["Selesai Loading → WH Out",visit.completed_at,visit.wh_out_at],
      ["Total WH In → WH Out",visit.wh_in_at,visit.wh_out_at]
    ];
    const result = {"ID Kunjungan":visit.id || "","Tanggal WH In":localDateKey(visit.wh_in_at),
      "Plat Nomor":visit.plate_number || "","Vendor":visit.vendor || "","Klien":clientName(visit),
      "Status":statusLabel(visit.process_status)};
    let hasAnomaly = false;
    stages.forEach(function (stage) {
      const mins = elapsedMinutes(stage[1],stage[2]);
      result[stage[0] + " (menit)"] = mins === null ? "" : mins;
      result[stage[0] + " (format)"] = formatMinutes(mins);
      if (stage[1] && stage[2] && new Date(stage[2]).getTime() < new Date(stage[1]).getTime()) hasAnomaly = true;
    });
    result["Anomali Waktu"] = hasAnomaly ? "Ya — timestamp akhir lebih awal" : "";
    result["Kunjungan Belum WH Out"] = visit.wh_in_at && !visit.wh_out_at ? "Ya" : "Tidak";
    return result;
  });
  const durationSheet = XLSX.utils.json_to_sheet(durationRows);
  durationSheet["!cols"] = Object.keys(durationRows[0] || {}).map(function (key) { return {wch:key.length > 24 ? 28 : 22}; });
  durationSheet["!autofilter"] = {ref:durationSheet["!ref"] || "A1"};
  durationSheet["!freeze"] = {xSplit:0,ySplit:1};
  XLSX.utils.book_append_sheet(workbook,durationSheet,"Analisis Durasi");

  const countBy = function (keyFn) {
    const counts = {};
    rows.forEach(function (visit) { const key = keyFn(visit) || "Tidak diketahui"; counts[key] = (counts[key] || 0) + 1; });
    return counts;
  };
  const summary = [
    ["Laporan Ekspor Kunjungan TRCM",""],["Tanggal WH In mulai",startDate],
    ["Tanggal WH In akhir",endDate],["Tanggal ekspor",formatExportDate(new Date().toISOString())],
    ["Total kunjungan",rows.length],
    ["Kunjungan belum WH Out",rows.filter(function (v) { return v.wh_in_at && !v.wh_out_at; }).length],
    ["",""],["Rekap Status Proses","Jumlah"]
  ];
  const statuses = countBy(function (v) { return statusLabel(v.process_status) || "Kosong"; });
  Object.keys(statuses).sort().forEach(function (key) { summary.push([key,statuses[key]]); });
  summary.push(["",""],["Rekap Aktivitas","Jumlah"]);
  const activities = countBy(function (v) { return v.activity_type === "inbound" ? "Inbound" : v.activity_type === "outbound" ? "Outbound" : v.activity_type; });
  Object.keys(activities).sort().forEach(function (key) { summary.push([key,activities[key]]); });
  summary.push(["",""],["Rekap Harian (berdasarkan WH In)","Jumlah Kunjungan"]);
  const daily = countBy(function (v) { return localDateKey(v.wh_in_at); });
  Object.keys(daily).sort().forEach(function (key) { summary.push([key,daily[key]]); });
  const totals = rows.map(function (v) { return elapsedMinutes(v.wh_in_at,v.wh_out_at); }).filter(function (v) { return v !== null; });
  summary.push(["",""],["Rata-rata durasi WH In → WH Out (menit)",totals.length ? Math.round(totals.reduce(function (a,b) { return a+b; },0) / totals.length) : ""],["Sampel durasi WH In → WH Out",totals.length]);
  const summarySheet = XLSX.utils.aoa_to_sheet(summary);
  summarySheet["!cols"] = [{wch:44},{wch:26}];
  XLSX.utils.book_append_sheet(workbook,summarySheet,"Ringkasan");
  return workbook;
}

exportButton.addEventListener("click", async function () {
  const startDate = exportDateStart.value, endDate = exportDateEnd.value;
  if (!startDate || !endDate) {
    await Swal.fire({icon:"info",title:"Pilih rentang tanggal",text:"Tentukan tanggal WH In mulai dan akhir untuk mengekspor data."});
    return;
  }
  if (startDate > endDate) {
    await Swal.fire({icon:"warning",title:"Rentang tanggal tidak valid",text:"Tanggal mulai harus sama dengan atau sebelum tanggal akhir."});
    return;
  }
  if (typeof XLSX === "undefined") {
    await Swal.fire({icon:"error",title:"Fitur Excel tidak tersedia",text:"Pustaka Excel gagal dimuat. Periksa koneksi lalu muat ulang halaman."});
    return;
  }
  exportButton.disabled = true;
  exportButton.classList.add("is-exporting");
  const originalLabel = exportButton.innerHTML;
  exportButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Menyiapkan Excel...';
  try {
    const rows = await fetchExportVisits(startDate,endDate);
    const workbook = buildExportWorkbook(rows,startDate,endDate);
    XLSX.writeFile(workbook,"trcm-laporan-kunjungan-" + startDate + "-sampai-" + endDate + ".xlsx",{compression:true});
    await Swal.fire({icon:"success",title:"Ekspor selesai",text:rows.length + " kunjungan dengan WH In dalam rentang tanggal berhasil diekspor.",confirmButtonText:"Selesai",confirmButtonColor:"#0066B3"});
  } catch (error) {
    console.error("TRCM export:",error);
    await Swal.fire({icon:"error",title:"Ekspor gagal",text:error.message || "Data gagal diekspor."});
  } finally {
    exportButton.disabled = false;
    exportButton.classList.remove("is-exporting");
    exportButton.innerHTML = originalLabel;
  }
});

window.trcmRegisterRefresh(loadVisits);
loadVisits();
});
</script>
