    <p class="login-subtitle">Truck Registration &amp; Control Management</p>
    <h1 id="login-title" class="visually-hidden">Masuk ke TRCM</h1>
    <div id="login-error" class="login-error" role="alert" aria-live="assertive">
      <strong data-error-title>Gagal masuk</strong>
      <span data-error-message>Periksa nama pengguna dan kata sandi, lalu coba lagi.</span>
    </div>
    <form action="#" method="post" id="loginForm" novalidate>
      <div class="login-form-group">
        <label for="username" class="login-form-label">Nama pengguna</label>
        <div class="login-input-group">
          <span class="login-input-icon" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
          <input id="username" name="username" type="text" class="login-input" autocomplete="username" placeholder="Masukkan nama pengguna" required>
        </div>
      </div>
      <div class="login-form-group">
        <label for="password" class="login-form-label">Kata sandi</label>
        <div class="login-input-group">
          <span class="login-input-icon" aria-hidden="true"><i class="bi bi-shield-lock-fill"></i></span>
          <input id="password" name="password" type="password" class="login-input login-input-password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
          <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Tampilkan kata sandi">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btn-submit">
        <span id="btn-submit-label">Masuk</span>
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </form>
    <p class="login-footer-text">TRCM <span class="font-monospace">v1.0</span></p>
  </main>
