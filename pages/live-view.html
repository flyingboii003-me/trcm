<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TRCM Live View — pemantauan armada Inbound dan Outbound">
<title>Live Dashboard — TRCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{color-scheme:light;--bg:#F2F5FA;--surface:#FFFFFF;--surface2:#F6F8FC;--border:#DFE5EF;--text:#0F1A2E;--muted:#55627A;--blue:#006ECD;--orange:#D97100;--green:#16794C;--red:#C70E17;--navy:#0F1A2E;--primary-soft:#EAF3FC;--orange-soft:#FFF1DC;--green-soft:#E5F6ED}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif}
body{min-height:100vh;padding:clamp(18px,2.3vw,40px)}
.live-shell{max-width:2200px;margin:0 auto}
.live-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:22px}
.brand{display:flex;align-items:center;gap:18px}
.brand-mark{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.eyebrow{font-size:.82rem;font-weight:800;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
h1{font-size:clamp(1.8rem,3vw,3.3rem);line-height:1.05;margin:5px 0 0;font-weight:800;letter-spacing:-.04em}
.clock{text-align:right;flex-shrink:0}
.clock-time{font:600 clamp(2rem,3.2vw,3.5rem)/1 "JetBrains Mono",monospace;letter-spacing:-.05em}
.clock-date{font-size:1rem;color:var(--muted);margin-top:9px}
.connection{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:.82rem;margin-top:10px}
.connection-dot{width:10px;height:10px;border-radius:50%;background:var(--orange);display:inline-block}
.connection.is-live .connection-dot{background:var(--green)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-6px 0 24px;flex-wrap:wrap}.toolbar-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tool-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:700 .88rem "Plus Jakarta Sans",sans-serif;text-decoration:none;cursor:pointer}.tool-button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.tool-button:focus-visible{outline:3px solid #006ECD55;outline-offset:2px}.status[data-status="registered"]{background:#EAF4FF;border-color:#93C5FD;color:#005BA8}.status[data-status="queue"]{background:#FEF3C7;border-color:#FACC15;color:#92400E}.status[data-status="started"]{background:#FFEDD5;border-color:#FB923C;color:#9A3412}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden}
.panel-head{padding:22px 24px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}
.panel-title{display:flex;align-items:center;gap:13px}
.panel-title i{font-size:1.8rem;color:var(--blue)}
.panel h2{font-size:clamp(1.4rem,2vw,2.1rem);margin:0;font-weight:800;letter-spacing:-.03em}
.total{font:600 2rem/1 "JetBrains Mono",monospace;background:var(--primary-soft);border:1px solid #A9CDEB;color:var(--navy);border-radius:13px;padding:12px 17px;min-width:76px;text-align:center}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:18px 20px 4px}
.counter{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 12px;min-width:0}
.counter-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:clamp(.7rem,.85vw,.95rem);font-weight:700;white-space:nowrap}
.counter-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.counter[data-status="started"] .counter-dot{background:var(--orange)}
.counter[data-status="completed"] .counter-dot{background:var(--blue)}
.counter[data-status="queue"] .counter-dot{background:#b4c0d5}
.counter-value{font:600 clamp(2.2rem,3vw,3.5rem)/1 "JetBrains Mono",monospace;margin-top:12px}
.truck-list{padding:16px 20px 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));align-items:start;gap:14px;overflow-x:auto}
.truck-row{background:#FFFFFF;border:1px solid var(--border);box-shadow:0 2px 8px rgba(15,26,46,.05);border-left:5px solid var(--muted);border-radius:14px;padding:15px 17px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.truck-row[data-status="started"]{border-left-color:var(--orange)}
.truck-row[data-status="completed"]{border-left-color:var(--blue)}
.truck-row[data-status="queue"]{border-left-color:#b4c0d5}
.truck-main{min-width:0}
.plate{font:600 clamp(1.4rem,2vw,1.9rem)/1.2 "JetBrains Mono",monospace;letter-spacing:-.03em;overflow-wrap:anywhere}
.truck-meta{font-size:clamp(.8rem,1vw,1.05rem);color:var(--muted);margin-top:7px;line-height:1.5}
.truck-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.status{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#F1F5FA;border:1px solid #C8D3E3;color:#33445E;font-size:clamp(.72rem,.9vw,.9rem);font-weight:800;white-space:nowrap}
.status[data-status="started"]{background:var(--orange-soft);border-color:#E6B56B;color:#874700}
.status[data-status="completed"]{background:#EAF3FC;border-color:#A9CDEB;color:#005BA8}
.status[data-status="registered"]{color:#33445E}
.status[data-status="queue"]{color:#33445E}
.duration{font:500 .88rem "JetBrains Mono",monospace;color:var(--muted)}
.state{padding:42px 18px;text-align:center;color:var(--muted);font-size:1.05rem}
.state i{display:block;font-size:2rem;margin-bottom:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:-6px 0 22px}
.toolbar-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kanban-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start;min-width:0}
.kanban-column{min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.kanban-column-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border);background:var(--surface2)}
.kanban-client{font-size:.95rem;font-weight:800;overflow-wrap:anywhere}
.kanban-count{font:600 .8rem "JetBrains Mono",monospace;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 8px;white-space:nowrap}
.kanban-cards{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:76px}
.kanban-cards .truck-row{grid-template-columns:minmax(0,1fr);align-items:start;padding:13px;gap:10px}
.kanban-cards .truck-side{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:left}
.kanban-cards .plate{font-size:1.15rem}
.kanban-cards .truck-meta{font-size:.78rem}
.kanban-empty{padding:22px 12px;color:var(--muted);text-align:center;font-size:.85rem}
.kanban-message{grid-column:1/-1}
.client-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:16px;min-width:0}
.client-group{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;min-width:0;box-shadow:0 2px 8px rgba(15,26,46,.04)}
.client-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);border-top:5px solid var(--client-color,#6B7280)}
.client-group-title{display:flex;align-items:center;gap:12px;min-width:0}
.client-color-dot{width:13px;height:13px;flex:0 0 13px;border-radius:50%;background:var(--client-color,#6B7280)}
.client-group-head h2{font-size:1.25rem;overflow-wrap:anywhere}
.client-group-total{font:600 1rem "JetBrains Mono",monospace;padding:7px 11px;border:1px solid var(--border);background:var(--surface);border-radius:10px;white-space:nowrap}
.client-activity-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}
.client-activity{min-width:0;border:1px solid var(--border);border-radius:15px;overflow:hidden;background:var(--surface)}
.client-activity-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.client-activity-title{display:flex;align-items:center;gap:10px;font-size:1.02rem;font-weight:800;margin:0}
.client-activity-title i{font-size:1.25rem;color:var(--activity-color,var(--blue))}
.client-activity-total{font:600 .88rem "JetBrains Mono",monospace;color:var(--muted);white-space:nowrap}
.client-activity .counters{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;padding:9px 9px 0}
.client-activity .counter{padding:8px 6px;border-radius:9px}
.client-activity .counter-label{font-size:clamp(.58rem,.55vw,.68rem);gap:4px}
.client-activity .counter-dot{width:8px;height:8px}
.client-activity .counter-value{font-size:1.25rem;margin-top:6px}
.client-activity .kanban-cards{padding:10px;gap:8px}
.client-activity .truck-row{grid-template-columns:minmax(0,1fr);align-items:stretch;gap:8px;padding:10px 11px;border-left-width:4px;border-radius:10px}
.client-activity .truck-main{display:flex;flex-direction:column;gap:5px}
.client-activity .plate{font-size:clamp(.92rem,1vw,1.12rem);line-height:1.25;letter-spacing:-.025em;overflow-wrap:anywhere}
.client-activity .truck-meta{font-size:clamp(.68rem,.72vw,.78rem);line-height:1.45;margin-top:0;overflow-wrap:anywhere}
.client-activity .truck-side{display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;text-align:left}
.client-activity .status{font-size:.68rem;padding:4px 7px;gap:5px}
.client-activity .duration{font-size:.7rem;font-weight:600}
.client-activity .truck-meta br{display:none}
.client-activity .truck-meta{display:block}
.client-activity .truck-meta{color:#48566D}

.client-activity .truck-row{border-left:5px solid var(--status-color,var(--client-color,#6B7280));border-top:1px solid color-mix(in srgb,var(--client-color,#6B7280) 24%,white);border-right:1px solid color-mix(in srgb,var(--client-color,#6B7280) 24%,white);border-bottom:1px solid color-mix(in srgb,var(--client-color,#6B7280) 24%,white);background:color-mix(in srgb,var(--client-color,#6B7280) 6%,white)}
.client-activity .truck-row[data-status="registered"],.client-activity .truck-row[data-status="wh_in"]{--status-color:#7C889F}
.client-activity .truck-row[data-status="queue"]{--status-color:#55627A}
.client-activity .truck-row[data-status="started"]{--status-color:var(--orange)}
.client-activity .truck-row[data-status="completed"]{--status-color:var(--green)}
.client-activity .truck-row .status[data-status="registered"],.client-activity .truck-row .status[data-status="wh_in"]{background:#EAF4FF;border-color:#93C5FD;color:#005BA8}
.client-activity .truck-row .status[data-status="queue"]{background:#FEF3C7;border-color:#FACC15;color:#92400E}
.client-activity .truck-row .status[data-status="started"]{background:#FFEDD5;border-color:#FB923C;color:#9A3412}
.client-activity .truck-row .status[data-status="completed"]{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.client-activity .truck-row[data-status="completed"]{--status-color:var(--green)}
.client-activity .truck-row[data-status="started"]{--status-color:var(--orange)}
.client-activity .truck-row[data-status="queue"]{--status-color:#D6A000}
.client-activity .truck-row[data-status="registered"],.client-activity .truck-row[data-status="wh_in"]{--status-color:#006ECD}
.client-activity .counter[data-status="completed"] .counter-dot{background:var(--green)}
.client-activity .counter[data-status="started"] .counter-dot{background:var(--orange)}
.client-activity .counter[data-status="queue"] .counter-dot{background:#D6A000}
.client-activity .counter[data-status="registered"] .counter-dot{background:#006ECD}
.counter[data-status="registered"] .counter-dot,.counter[data-status="wh_in"] .counter-dot,.truck-row[data-status="registered"],.truck-row[data-status="wh_in"]{--status-color:#7C889F}
.counter[data-status="queue"] .counter-dot,.truck-row[data-status="queue"]{--status-color:#55627A}
.counter[data-status="started"] .counter-dot,.truck-row[data-status="started"]{--status-color:var(--orange)}
.counter[data-status="completed"] .counter-dot,.truck-row[data-status="completed"]{--status-color:var(--blue)}
.counter .counter-dot{background:var(--status-color,#7C889F)}
.truck-row{border-left-color:var(--status-color,#7C889F)}
.status[data-status="registered"],.status[data-status="wh_in"]{background:#F1F4F8;border-color:#CBD4E1;color:#55627A}
.status[data-status="queue"]{background:#E9EDF4;border-color:#C1CCDC;color:#33445E}
.status[data-status="started"]{background:var(--orange-soft);border-color:#E6B56B;color:#874700}
.status[data-status="completed"]{background:#EAF3FC;border-color:#A9CDEB;color:#005BA8}
.footer{display:flex;justify-content:flex-end;gap:16px;color:var(--muted);font-size:.8rem;padding:18px 4px 0}
[hidden]{display:none!important}
@media(max-width:1400px){.client-board{grid-template-columns:repeat(2,minmax(0,1fr))}}\n@media(max-width:1100px){.client-board{grid-template-columns:repeat(2,minmax(0,1fr))}.panels{grid-template-columns:1fr}.counters{grid-template-columns:repeat(4,minmax(0,1fr))}.truck-list{display:block}.kanban-board{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.client-activity-board{gap:12px;padding:12px}.client-activity .counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.client-board{grid-template-columns:minmax(0,1fr)}body{padding:14px}.toolbar{align-items:stretch}.toolbar-group{width:100%}.toolbar-group .tool-button{flex:1}.live-header{align-items:flex-start;gap:12px}.brand{gap:10px}.brand-mark{width:42px;height:42px}.eyebrow{font-size:.65rem}h1{font-size:1.5rem}.clock-time{font-size:1.45rem}.clock-date{font-size:.75rem}.connection{font-size:.65rem}.panel-head{padding:16px}.counters{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 12px 0}.truck-list{display:block;padding:12px}.kanban-board{grid-template-columns:minmax(0,1fr)}.client-group-head{padding:14px}.client-group-head h2{font-size:1.05rem}.client-activity-board{grid-template-columns:minmax(0,1fr);padding:10px}.client-activity .counters{grid-template-columns:repeat(4,minmax(0,1fr))}.client-activity .counter{padding:8px 6px}.client-activity .counter-label{font-size:.61rem;gap:4px}.client-activity .counter-value{font-size:1.2rem}.kanban-cards .truck-row{padding:12px}.kanban-cards .truck-side{align-items:flex-start;justify-content:flex-start}.total{font-size:1.5rem;min-width:60px;padding:10px}.footer{flex-direction:column}}
/* Final status badge palette: keep these rules after legacy overrides. */
.status[data-status="registered"],
.status[data-status="wh_in"]{background:#EAF4FF;border-color:#93C5FD;color:#005BA8}
.status[data-status="queue"]{background:#FEF3C7;border-color:#FACC15;color:#92400E}
.status[data-status="started"]{background:#FFEDD5;border-color:#FB923C;color:#9A3412}
.status[data-status="completed"]{background:#DCFCE7;border-color:#86EFAC;color:#166534}
</style>
</head>
<body>
<main class="live-shell" aria-label="Pemantauan armada secara langsung">
<header class="live-header">
  <div class="brand">
    <div class="brand-mark"><img src="../assets/cj-logo.svg" alt="CJ Logistics"></div>
    <div><div class="eyebrow">TRCM · CJ Logistics</div><h1>Live Dashboard</h1></div>
  </div>
  <div class="clock"><div id="clock-time" class="clock-time">--:--:--</div><div id="clock-date" class="clock-date">Memuat waktu...</div><div id="connection" class="connection"><span class="connection-dot"></span><span id="connection-label">Menghubungkan data</span></div></div>
</header>
<div class="toolbar" aria-label="Kontrol Live Dashboard"><div class="toolbar-group"><a class="tool-button" href="dashboard.html"><i class="bi bi-arrow-left" aria-hidden="true"></i>Kembali ke Dashboard</a><button class="tool-button primary" id="fullscreen-button" type="button" aria-label="Aktifkan tampilan layar penuh"><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i><span>Layar penuh</span></button></div></div>
<div id="page-state" class="state" role="status"><i class="bi bi-arrow-repeat"></i>Memuat data armada...</div>
<div id="live-panels" hidden>
  <div id="client-board" class="client-board" aria-label="Kanban armada berdasarkan klien"></div>
</div>
<footer class="footer"><span id="updated-at">Pembaruan terakhir: —</span></footer>
</main>
<script src="../assets/js/config.js"></script>
<script>
(function(){
"use strict";
const session=getTrcmSession();
const pageState=document.getElementById("page-state"),panels=document.getElementById("live-panels");
const connection=document.getElementById("connection"),connectionLabel=document.getElementById("connection-label");
let visits=[],clients=[],realtimeClient=null,realtimeTimer=null,clockTimer=null,fallbackTimer=null;
const fullscreenButton=document.getElementById("fullscreen-button");
const labels={registered:"Terdaftar",wh_in:"Terdaftar",queue:"Parkir",started:"Sedang proses",completed:"Selesai"};
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function statusOf(v){return labels[v.process_status]?v.process_status:"registered";}
function activityOf(v){return v.activity_type==="inbound"?"Inbound":"Outbound";}
function formatDuration(v){const start=v.wh_in_at||v.registered_at||v.created_at;if(!start)return"—";const mins=Math.max(0,Math.floor((Date.now()-new Date(start).getTime())/60000));return Math.floor(mins/60)+"j "+String(mins%60).padStart(2,"0")+"m";}
function formatTime(v){const value=v.started_at||v.registered_at||v.wh_in_at;if(!value)return"Jam masuk belum tersedia";return"Masuk "+new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit"}).format(new Date(value));}
const clientPalette={"kimberly clark":"#006ECD","henkel":"#EF151E","modena":"#111111"};
const statusPalette={registered:"#006ECD",wh_in:"#006ECD",queue:"#D6A000",started:"#F97316",completed:"#16A34A"};
function clientColor(name){return clientPalette[String(name||"").trim().toLowerCase()]||"#6B7280";}
function renderCounters(rows,prefix){
 const definitions=[["registered","Terdaftar"],["queue","Parkir"],["started","Proses"],["completed","Selesai"]];
 return '<div class="counters">'+definitions.map(([status,label])=>'<div class="counter" data-status="'+status+'"><div class="counter-label"><span class="counter-dot"></span>'+label+'</div><div class="counter-value">'+rows.filter(v=>statusOf(v)===status||(status==="registered"&&statusOf(v)==="wh_in")).length+'</div></div>').join("")+'</div>';
}
function renderTruckCard(v,color){
 const status=statusOf(v),card=v.cards&&v.cards.card_number?v.cards.card_number:"Tanpa kartu";
 const vendor=v.vendor||"Vendor belum diisi";
 const gate=v.gates&&v.gates.gate_number?" · Gate "+v.gates.gate_number:"";
 const line=v.line_numbers&&v.line_numbers.line_number?" · Line "+v.line_numbers.line_number:"";
 const driver=v.driver_name||"Pengemudi belum diisi";
 const shipment=v.shipment_number?" · Shipment "+v.shipment_number:"";
 const destination=v.destination_city?" · Tujuan "+v.destination_city:"";
 return '<article class="truck-row" data-status="'+esc(status)+'" style="--client-color:'+color+';--status-color:'+(statusPalette[status]||statusPalette.registered)+'"><div class="truck-main"><div class="plate">'+esc(v.plate_number||"Plat belum diisi")+'</div><div class="truck-meta">'+esc(card)+' · '+esc(vendor)+' · '+esc(driver)+'<br>'+esc(gate)+esc(line)+esc(shipment)+esc(destination)+' · '+esc(formatTime(v))+'</div></div><div class="truck-side"><span class="status" data-status="'+esc(status)+'">'+esc(labels[status]||"Terdaftar")+'</span><span class="duration">'+esc(formatDuration(v))+'</span></div></article>';
}
function renderActivityColumn(clientName,type,rows,color){
 const inbound=type==="inbound",label=inbound?"Inbound":"Outbound",icon=inbound?"bi-box-arrow-in-down":"bi-box-arrow-up";
 const cards=rows.slice(0,16).map(v=>renderTruckCard(v,color)).join("");
 const more=rows.length>16?'<div class="truck-meta">Menampilkan 16 dari '+rows.length+' armada aktif.</div>':"";
 return '<section class="client-activity" style="--client-color:'+color+';--activity-color:'+(inbound?"#006ECD":"#EF151E")+'" aria-label="'+esc(clientName+" "+label)+'"><header class="client-activity-head"><h3 class="client-activity-title"><i class="bi '+icon+'" aria-hidden="true"></i>'+label+'</h3><span class="client-activity-total">'+rows.length+' armada</span></header><div class="kanban-cards">'+(cards||'<div class="kanban-empty">Tidak ada armada '+label+' aktif.</div>')+more+'</div></section>';
}
function render(){
 const active=visits.filter(v=>!v.wh_out_at&&(v.activity_type==="inbound"||v.activity_type==="outbound")).sort((a,b)=>new Date(a.wh_in_at||a.registered_at||a.created_at||0)-new Date(b.wh_in_at||b.registered_at||b.created_at||0));
 const groups=new Map();
 clients.forEach(client=>{const name=String(client.name||"").trim();if(name&&!groups.has(name))groups.set(name,{inbound:[],outbound:[]});});
 active.forEach(visit=>{
   const clientName=visit.clients&&visit.clients.name?String(visit.clients.name):"Klien belum diisi";
   if(!groups.has(clientName))groups.set(clientName,{inbound:[],outbound:[]});
   groups.get(clientName)[visit.activity_type].push(visit);
 });
 const board=document.getElementById("client-board");
 if(!groups.size){board.innerHTML='<div class="state kanban-message"><i class="bi bi-truck"></i>Tidak ada armada aktif untuk ditampilkan.</div>';}
 else{
   board.innerHTML=Array.from(groups.entries()).sort((a,b)=>a[0].localeCompare(b[0],"id")).map(([clientName,activities])=>{
     const color=clientColor(clientName),total=activities.inbound.length+activities.outbound.length;
     return '<section class="client-group" style="--client-color:'+color+'" aria-label="Klien '+esc(clientName)+'"><header class="client-group-head"><div class="client-group-title"><span class="client-color-dot" aria-hidden="true"></span><h2>'+esc(clientName)+'</h2></div><span class="client-group-total">'+total+' armada aktif</span></header><div class="client-activity-board">'+renderActivityColumn(clientName,"inbound",activities.inbound,color)+renderActivityColumn(clientName,"outbound",activities.outbound,color)+'</div></section>';
   }).join("");
 }
 panels.hidden=false;pageState.hidden=true;
 document.getElementById("updated-at").textContent="Pembaruan terakhir: "+new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());
}
async function request(path,options){const response=await fetch(SUPABASE_URL+path,Object.assign({headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+session.access_token}},options||{}));let data=null;try{data=await response.json();}catch{}if(response.status===401){sessionStorage.removeItem("trcm_session");location.replace("../index.html");return null;}if(!response.ok)throw new Error(data&&(data.message||data.details||data.hint)||"Permintaan data Live View gagal.");return data;}
async function loadVisits(){try{const select="id,plate_number,driver_name,activity_type,process_status,wh_in_at,registered_at,started_at,completed_at,wh_out_at,created_at,shipment_number,destination_city,vendor,card_id,client_id,gate_id,line_number_id,cards(card_number),clients(name),gates(gate_number),line_numbers(line_number)";const data=await request("/rest/v1/visits?select="+encodeURIComponent(select)+"&wh_out_at=is.null&order=created_at.asc");if(!Array.isArray(data))throw new Error("Respons data Live View tidak valid.");visits=data;try{const clientData=await request("/rest/v1/clients?select=id,name&order=name.asc");if(Array.isArray(clientData))clients=clientData;}catch(clientError){console.warn("Daftar klien Live View tidak dapat dimuat; menampilkan klien dari data armada aktif.",clientError);clients=[];}render();}catch(error){console.error("TRCM Live View:",error);if(!panels.hidden){connection.classList.remove("is-live");connectionLabel.textContent="Data tertunda · mencoba lagi";}else{pageState.innerHTML='<i class="bi bi-exclamation-triangle"></i>Data Live View gagal dimuat. Periksa koneksi atau akses Viewer, lalu muat ulang halaman.';pageState.setAttribute("role","alert");}}}
async function checkPermission(){if(!session||!session.access_token||!session.user){location.replace("../index.html");return false;}const rows=await request("/rest/v1/rpc/get_my_permissions",{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:"{}"});if(!Array.isArray(rows)||!rows.some(r=>r.resource_key==="live_view"&&r.permission_key==="view")){pageState.innerHTML='<i class="bi bi-shield-lock"></i>Akses Live View tidak tersedia untuk akun ini.';pageState.setAttribute("role","alert");return false;}return true;}
function updateClock(){const now=new Date();document.getElementById("clock-time").textContent=new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);document.getElementById("clock-date").textContent=new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(now);}
function connectRealtime(){const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";script.async=true;script.onload=function(){if(!window.supabase||!window.supabase.createClient)return;realtimeClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);realtimeClient.realtime.setAuth(session.access_token);realtimeClient.channel("trcm-live-view").on("postgres_changes",{event:"*",schema:"public",table:"visits"},function(){if(realtimeTimer)clearTimeout(realtimeTimer);realtimeTimer=setTimeout(loadVisits,400);}).subscribe(function(status){const live=status==="SUBSCRIBED";connection.classList.toggle("is-live",live);connectionLabel.textContent=live?"Realtime aktif":"Realtime "+String(status||"tidak tersedia").toLowerCase();});};script.onerror=function(){connectionLabel.textContent="Refresh berkala aktif";};document.head.appendChild(script);}
fullscreenButton.addEventListener("click",async function(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else{await document.exitFullscreen();}}catch(error){console.error("TRCM Live Dashboard fullscreen:",error);}});
document.addEventListener("fullscreenchange",function(){const active=Boolean(document.fullscreenElement);fullscreenButton.innerHTML=active?'<i class="bi bi-fullscreen-exit" aria-hidden="true"></i><span>Keluar layar penuh</span>':'<i class="bi bi-arrows-fullscreen" aria-hidden="true"></i><span>Layar penuh</span>';fullscreenButton.setAttribute("aria-label",active?"Keluar dari layar penuh":"Aktifkan tampilan layar penuh");});
(async function init(){updateClock();clockTimer=setInterval(updateClock,1000);if(!session||!session.access_token||!session.user){location.replace("../index.html");return;}try{if(!await checkPermission())return;await loadVisits();connectRealtime();fallbackTimer=setInterval(loadVisits,60000);}catch(error){console.error("TRCM Live View permission:",error);pageState.innerHTML='<i class="bi bi-exclamation-triangle"></i>Hak akses Live View gagal diverifikasi. Periksa koneksi, lalu muat ulang halaman.';pageState.setAttribute("role","alert");}})();
window.addEventListener("beforeunload",function(){if(realtimeClient)realtimeClient.removeAllChannels();if(realtimeTimer)clearTimeout(realtimeTimer);if(clockTimer)clearInterval(clockTimer);if(fallbackTimer)clearInterval(fallbackTimer);});
})();
</script>
</body>
