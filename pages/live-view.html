<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TRCM Live View — pemantauan armada Inbound dan Outbound">
<title>Live Dashboard — TRCM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{color-scheme:light;--bg:#F2F5FA;--surface:#FFFFFF;--surface2:#F6F8FC;--border:#DFE5EF;--text:#0F1A2E;--muted:#55627A;--blue:#006ECD;--orange:#D97100;--green:#16794C;--red:#C70E17;--navy:#0F1A2E;--primary-soft:#EAF3FC;--orange-soft:#FFF1DC;--green-soft:#E5F6ED}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",sans-serif}
body{min-height:100vh;padding:clamp(18px,2.3vw,40px)}
.live-shell{max-width:2200px;margin:0 auto}
.live-header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:28px;border-bottom:1px solid var(--border);padding-bottom:22px}
.brand{display:flex;align-items:center;gap:18px}
.brand-mark{width:58px;height:58px;border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.eyebrow{font-size:.82rem;font-weight:800;letter-spacing:.16em;color:var(--blue);text-transform:uppercase}
h1{font-size:clamp(1.8rem,3vw,3.3rem);line-height:1.05;margin:5px 0 0;font-weight:800;letter-spacing:-.04em}
.clock{text-align:right;flex-shrink:0}
.clock-time{font:600 clamp(2rem,3.2vw,3.5rem)/1 "JetBrains Mono",monospace;letter-spacing:-.05em}
.clock-date{font-size:1rem;color:var(--muted);margin-top:9px}
.connection{display:inline-flex;align-items:center;gap:9px;color:var(--muted);font-size:.82rem;margin-top:10px}
.connection-dot{width:10px;height:10px;border-radius:50%;background:var(--orange);display:inline-block}
.connection.is-live .connection-dot{background:var(--green)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:-6px 0 24px;flex-wrap:wrap}.toolbar-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filter-label{font-size:.85rem;font-weight:700;color:var(--muted)}.client-filter{min-width:220px;min-height:44px;padding:10px 38px 10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:600 .9rem "Plus Jakarta Sans",sans-serif}.tool-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:700 .88rem "Plus Jakarta Sans",sans-serif;text-decoration:none;cursor:pointer}.tool-button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.tool-button:focus-visible,.client-filter:focus-visible{outline:3px solid #006ECD55;outline-offset:2px}.status[data-status="registered"]{background:#EAF4FF;border-color:#93C5FD;color:#005BA8}.status[data-status="queue"]{background:#FEF3C7;border-color:#FACC15;color:#92400E}.status[data-status="started"]{background:#FFEDD5;border-color:#FB923C;color:#9A3412}.status[data-status="completed"]{background:#DCFCE7;border-color:#86EFAC;color:#166534}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.panel{min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden}
.panel-head{padding:22px 24px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px}
.panel-title{display:flex;align-items:center;gap:13px}
.panel-title i{font-size:1.8rem;color:var(--blue)}
.panel h2{font-size:clamp(1.4rem,2vw,2.1rem);margin:0;font-weight:800;letter-spacing:-.03em}
.total{font:600 2rem/1 "JetBrains Mono",monospace;background:var(--primary-soft);border:1px solid #A9CDEB;color:var(--navy);border-radius:13px;padding:12px 17px;min-width:76px;text-align:center}
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:18px 20px 4px}
.counter{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 12px;min-width:0}
.counter-label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:clamp(.7rem,.85vw,.95rem);font-weight:700;white-space:nowrap}
.counter-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0}
.counter[data-status="started"] .counter-dot{background:var(--orange)}
.counter[data-status="completed"] .counter-dot{background:var(--blue)}
.counter[data-status="queue"] .counter-dot{background:#b4c0d5}
.counter-value{font:600 clamp(2.2rem,3vw,3.5rem)/1 "JetBrains Mono",monospace;margin-top:12px}
.truck-list{padding:16px 20px 20px;display:flex;flex-direction:column;gap:11px}
.truck-row{background:#FFFFFF;border:1px solid var(--border);box-shadow:0 2px 8px rgba(15,26,46,.05);border-left:5px solid var(--muted);border-radius:14px;padding:15px 17px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px}
.truck-row[data-status="started"]{border-left-color:var(--orange)}
.truck-row[data-status="completed"]{border-left-color:var(--blue)}
.truck-row[data-status="queue"]{border-left-color:#b4c0d5}
.truck-main{min-width:0}
.plate{font:600 clamp(1.4rem,2vw,1.9rem)/1.2 "JetBrains Mono",monospace;letter-spacing:-.03em;overflow-wrap:anywhere}
.truck-meta{font-size:clamp(.8rem,1vw,1.05rem);color:var(--muted);margin-top:7px;line-height:1.5}
.truck-side{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.status{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border-radius:999px;background:#F1F5FA;border:1px solid #C8D3E3;color:#33445E;font-size:clamp(.72rem,.9vw,.9rem);font-weight:800;white-space:nowrap}
.status[data-status="started"]{background:var(--orange-soft);border-color:#E6B56B;color:#874700}
.status[data-status="completed"]{background:#EAF3FC;border-color:#A9CDEB;color:#005BA8}
.status[data-status="registered"]{color:#33445E}
.status[data-status="queue"]{color:#33445E}
.duration{font:500 .88rem "JetBrains Mono",monospace;color:var(--muted)}
.state{padding:42px 18px;text-align:center;color:var(--muted);font-size:1.05rem}
.state i{display:block;font-size:2rem;margin-bottom:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:-6px 0 22px}
.toolbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.client-filter{display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:700;color:var(--muted)}
.client-filter select{min-width:220px;min-height:44px;padding:10px 38px 10px 13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:600 .9rem "Plus Jakarta Sans",sans-serif}
.toolbar-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 15px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);font:700 .9rem "Plus Jakarta Sans",sans-serif;text-decoration:none;cursor:pointer}
.toolbar-button:hover{background:var(--surface2)}
.toolbar-button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.counter[data-status="registered"] .counter-dot,.counter[data-status="wh_in"] .counter-dot,.truck-row[data-status="registered"],.truck-row[data-status="wh_in"]{--status-color:#7C889F}
.counter[data-status="queue"] .counter-dot,.truck-row[data-status="queue"]{--status-color:#55627A}
.counter[data-status="started"] .counter-dot,.truck-row[data-status="started"]{--status-color:var(--orange)}
.counter[data-status="completed"] .counter-dot,.truck-row[data-status="completed"]{--status-color:var(--blue)}
.counter .counter-dot{background:var(--status-color,#7C889F)}
.truck-row{border-left-color:var(--status-color,#7C889F)}
.status[data-status="registered"],.status[data-status="wh_in"]{background:#F1F4F8;border-color:#CBD4E1;color:#55627A}
.status[data-status="queue"]{background:#E9EDF4;border-color:#C1CCDC;color:#33445E}
.status[data-status="started"]{background:var(--orange-soft);border-color:#E6B56B;color:#874700}
.status[data-status="completed"]{background:#EAF3FC;border-color:#A9CDEB;color:#005BA8}
.footer{display:flex;justify-content:flex-end;gap:16px;color:var(--muted);font-size:.8rem;padding:18px 4px 0}
[hidden]{display:none!important}
@media(max-width:1100px){.panels{grid-template-columns:1fr}.counters{grid-template-columns:repeat(4,minmax(0,1fr))}.truck-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){body{padding:14px}.toolbar{align-items:stretch}.toolbar-actions{width:100%}.toolbar-button{flex:1}.client-filter{width:100%;align-items:stretch;flex-direction:column;gap:6px}.client-filter select{width:100%}.live-header{align-items:flex-start;gap:12px}.brand{gap:10px}.brand-mark{width:42px;height:42px}.eyebrow{font-size:.65rem}h1{font-size:1.5rem}.clock-time{font-size:1.45rem}.clock-date{font-size:.75rem}.connection{font-size:.65rem}.panel-head{padding:16px}.counters{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 12px 0}.truck-list{display:flex;padding:12px}.truck-row{padding:12px;grid-template-columns:minmax(0,1fr)}.truck-side{align-items:flex-start;text-align:left;flex-direction:row;flex-wrap:wrap}.total{font-size:1.5rem;min-width:60px;padding:10px}.footer{flex-direction:column}}
</style>
</head>
<body>
<main class="live-shell" aria-label="Pemantauan armada secara langsung">
<header class="live-header">
  <div class="brand">
    <div class="brand-mark"><img src="../assets/cj-logo.svg" alt="CJ Logistics"></div>
    <div><div class="eyebrow">TRCM · CJ Logistics</div><h1>Live Dashboard</h1></div>
  </div>
  <div class="clock"><div id="clock-time" class="clock-time">--:--:--</div><div id="clock-date" class="clock-date">Memuat waktu...</div><div id="connection" class="connection"><span class="connection-dot"></span><span id="connection-label">Menghubungkan data</span></div></div>
</header>
<div class="toolbar" aria-label="Kontrol Live Dashboard"><div class="toolbar-group"><label class="filter-label" for="client-filter">Klien</label><select id="client-filter" class="client-filter"><option value="all">Semua Klien</option><option value="Modena">Modena</option><option value="Kimberly Clark">Kimberly Clark</option><option value="Henkel">Henkel</option></select></div><div class="toolbar-group"><a class="tool-button" href="dashboard.html"><i class="bi bi-arrow-left" aria-hidden="true"></i>Kembali ke Dashboard</a><button class="tool-button primary" id="fullscreen-button" type="button" aria-label="Aktifkan tampilan layar penuh"><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i><span>Layar penuh</span></button></div></div>
<div id="page-state" class="state" role="status"><i class="bi bi-arrow-repeat"></i>Memuat data armada...</div>
<div id="live-panels" class="panels" hidden>
  <section class="panel" aria-labelledby="inbound-title">
    <div class="panel-head"><div class="panel-title"><i class="bi bi-box-arrow-in-down"></i><h2 id="inbound-title">Inbound</h2></div><div class="total" id="inbound-total">0</div></div>
    <div class="counters">
      <div class="counter" data-status="registered"><div class="counter-label"><span class="counter-dot"></span>Terdaftar</div><div class="counter-value" id="inbound-registered">0</div></div>
      <div class="counter" data-status="queue"><div class="counter-label"><span class="counter-dot"></span>Parkir</div><div class="counter-value" id="inbound-queue">0</div></div>
      <div class="counter" data-status="started"><div class="counter-label"><span class="counter-dot"></span>Proses</div><div class="counter-value" id="inbound-started">0</div></div>
      <div class="counter" data-status="completed"><div class="counter-label"><span class="counter-dot"></span>Selesai</div><div class="counter-value" id="inbound-completed">0</div></div>
    </div>
    <div class="truck-list" id="inbound-list"></div>
  </section>
  <section class="panel" aria-labelledby="outbound-title">
    <div class="panel-head"><div class="panel-title"><i class="bi bi-box-arrow-up"></i><h2 id="outbound-title">Outbound</h2></div><div class="total" id="outbound-total">0</div></div>
    <div class="counters">
      <div class="counter" data-status="registered"><div class="counter-label"><span class="counter-dot"></span>Terdaftar</div><div class="counter-value" id="outbound-registered">0</div></div>
      <div class="counter" data-status="queue"><div class="counter-label"><span class="counter-dot"></span>Parkir</div><div class="counter-value" id="outbound-queue">0</div></div>
      <div class="counter" data-status="started"><div class="counter-label"><span class="counter-dot"></span>Proses</div><div class="counter-value" id="outbound-started">0</div></div>
      <div class="counter" data-status="completed"><div class="counter-label"><span class="counter-dot"></span>Selesai</div><div class="counter-value" id="outbound-completed">0</div></div>
    </div>
    <div class="truck-list" id="outbound-list"></div>
  </section>
</div>
<footer class="footer"><span id="updated-at">Pembaruan terakhir: —</span></footer>
</main>
<script>
(function(){
"use strict";
const SUPABASE_URL="https://pcednpmjyfkuomfcmian.supabase.co";
const SUPABASE_KEY="sb_publishable_ERlBrySRotVM5jfLA1oukQ_Cg0gmgIp";
const session=(()=>{try{return JSON.parse(sessionStorage.getItem("trcm_session")||"null");}catch{return null;}})();
const pageState=document.getElementById("page-state"),panels=document.getElementById("live-panels");
const connection=document.getElementById("connection"),connectionLabel=document.getElementById("connection-label");
let visits=[],realtimeClient=null,realtimeTimer=null,clockTimer=null,fallbackTimer=null;
const clientFilter=document.getElementById("client-filter");
const fullscreenButton=document.getElementById("fullscreen-button");
const labels={registered:"Terdaftar",wh_in:"Terdaftar",queue:"Parkir",started:"Sedang proses",completed:"Selesai"};
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function statusOf(v){return labels[v.process_status]?v.process_status:"registered";}
function activityOf(v){return v.activity_type==="inbound"?"Inbound":"Outbound";}
function formatDuration(v){const start=v.wh_in_at||v.registered_at||v.created_at;if(!start)return"—";const mins=Math.max(0,Math.floor((Date.now()-new Date(start).getTime())/60000));return Math.floor(mins/60)+"j "+String(mins%60).padStart(2,"0")+"m";}
function formatTime(v){const value=v.started_at||v.registered_at||v.wh_in_at;if(!value)return"Jam masuk belum tersedia";return"Masuk "+new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit"}).format(new Date(value));}
function renderPanel(type){
 const selectedClient=clientFilter.value;
 const rows=visits.filter(v=>v.activity_type===type&&!v.wh_out_at&&(selectedClient==="all"||(v.clients&&v.clients.name===selectedClient))).sort((a,b)=>new Date(a.wh_in_at||a.registered_at||a.created_at||0)-new Date(b.wh_in_at||b.registered_at||b.created_at||0));
 const prefix=type==="inbound"?"inbound":"outbound";
 document.getElementById(prefix+"-total").textContent=String(rows.length);
 ["registered","queue","started","completed"].forEach(status=>{document.getElementById(prefix+"-"+status).textContent=String(rows.filter(v=>statusOf(v)===status||(status==="registered"&&statusOf(v)==="wh_in")).length);});
 const list=document.getElementById(prefix+"-list");
 if(!rows.length){list.innerHTML='<div class="state"><i class="bi bi-truck"></i>Tidak ada armada aktif untuk '+(type==="inbound"?"Inbound":"Outbound")+(selectedClient==="all"?"":" pada klien "+esc(selectedClient))+'.</div>';return;}
 list.innerHTML=rows.slice(0,16).map(v=>{
   const status=statusOf(v),card=v.cards&&v.cards.card_number?v.cards.card_number:"Tanpa kartu";
   const vendor=v.vendor||"Vendor belum diisi";
   const client=v.clients&&v.clients.name?v.clients.name:"Klien belum diisi";
   const gate=v.gates&&v.gates.gate_number?" · Gate "+v.gates.gate_number:"";
   const line=v.line_numbers&&v.line_numbers.line_number?" · Line "+v.line_numbers.line_number:"";
   const driver=v.driver_name||"Pengemudi belum diisi";
   const shipment=v.shipment_number?" · Shipment "+v.shipment_number:"";
   const destination=v.destination_city?" · Tujuan "+v.destination_city:"";
   return '<article class="truck-row" data-status="'+esc(status)+'"><div class="truck-main"><div class="plate">'+esc(v.plate_number||"Plat belum diisi")+'</div><div class="truck-meta">'+esc(card)+' · '+esc(vendor)+' · '+esc(driver)+'<br>'+esc(client)+esc(gate)+esc(line)+esc(shipment)+esc(destination)+' · '+esc(formatTime(v))+'</div></div><div class="truck-side"><span class="status" data-status="'+esc(status)+'">'+esc(labels[status]||"Terdaftar")+'</span><span class="duration">'+esc(formatDuration(v))+'</span></div></article>';
 }).join("");
 if(rows.length>16)list.insertAdjacentHTML("beforeend",'<div class="truck-meta">Menampilkan 16 dari '+rows.length+' armada aktif.</div>');
}
function render(){renderPanel("inbound");renderPanel("outbound");panels.hidden=false;pageState.hidden=true;document.getElementById("updated-at").textContent="Pembaruan terakhir: "+new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());}
async function request(path,options){const response=await fetch(SUPABASE_URL+path,Object.assign({headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+session.access_token}},options||{}));let data=null;try{data=await response.json();}catch{}if(response.status===401){sessionStorage.removeItem("trcm_session");location.replace("../index.html");return null;}if(!response.ok)throw new Error(data&&(data.message||data.details||data.hint)||"Permintaan data Live View gagal.");return data;}
async function loadVisits(){try{const select="id,plate_number,driver_name,activity_type,process_status,wh_in_at,registered_at,started_at,completed_at,wh_out_at,created_at,shipment_number,destination_city,vendor,card_id,client_id,gate_id,line_number_id,cards(card_number),clients(name),gates(gate_number),line_numbers(line_number)";const data=await request("/rest/v1/visits?select="+encodeURIComponent(select)+"&wh_out_at=is.null&order=created_at.asc");if(!Array.isArray(data))throw new Error("Respons data Live View tidak valid.");visits=data;render();}catch(error){console.error("TRCM Live View:",error);if(!panels.hidden){connection.classList.remove("is-live");connectionLabel.textContent="Data tertunda · mencoba lagi";}else{pageState.innerHTML='<i class="bi bi-exclamation-triangle"></i>Data Live View gagal dimuat. Periksa koneksi atau akses Viewer, lalu muat ulang halaman.';pageState.setAttribute("role","alert");}}}
async function checkPermission(){if(!session||!session.access_token||!session.user){location.replace("../index.html");return false;}const rows=await request("/rest/v1/rpc/get_my_permissions",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:"{}"});if(!Array.isArray(rows)||!rows.some(r=>r.resource_key==="live_view"&&r.permission_key==="view")){pageState.innerHTML='<i class="bi bi-shield-lock"></i>Akses Live View tidak tersedia untuk akun ini.';pageState.setAttribute("role","alert");return false;}return true;}
function updateClock(){const now=new Date();document.getElementById("clock-time").textContent=new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now);document.getElementById("clock-date").textContent=new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"2-digit",month:"long",year:"numeric"}).format(now);}
function connectRealtime(){const script=document.createElement("script");script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";script.async=true;script.onload=function(){if(!window.supabase||!window.supabase.createClient)return;realtimeClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);realtimeClient.realtime.setAuth(session.access_token);realtimeClient.channel("trcm-live-view").on("postgres_changes",{event:"*",schema:"public",table:"visits"},function(){if(realtimeTimer)clearTimeout(realtimeTimer);realtimeTimer=setTimeout(loadVisits,400);}).subscribe(function(status){const live=status==="SUBSCRIBED";connection.classList.toggle("is-live",live);connectionLabel.textContent=live?"Realtime aktif":"Realtime "+String(status||"tidak tersedia").toLowerCase();});};script.onerror=function(){connectionLabel.textContent="Refresh berkala aktif";};document.head.appendChild(script);}
clientFilter.addEventListener("change",render);
fullscreenButton.addEventListener("click",async function(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}else{await document.exitFullscreen();}}catch(error){console.error("TRCM Live Dashboard fullscreen:",error);}});
document.addEventListener("fullscreenchange",function(){const active=Boolean(document.fullscreenElement);fullscreenButton.innerHTML=active?'<i class="bi bi-fullscreen-exit" aria-hidden="true"></i><span>Keluar layar penuh</span>':'<i class="bi bi-arrows-fullscreen" aria-hidden="true"></i><span>Layar penuh</span>';fullscreenButton.setAttribute("aria-label",active?"Keluar dari layar penuh":"Aktifkan tampilan layar penuh");});
(async function init(){updateClock();clockTimer=setInterval(updateClock,1000);if(!session||!session.access_token||!session.user){location.replace("../index.html");return;}try{if(!await checkPermission())return;await loadVisits();connectRealtime();fallbackTimer=setInterval(loadVisits,60000);}catch(error){console.error("TRCM Live View permission:",error);pageState.innerHTML='<i class="bi bi-exclamation-triangle"></i>Hak akses Live View gagal diverifikasi. Periksa koneksi, lalu muat ulang halaman.';pageState.setAttribute("role","alert");}})();
window.addEventListener("beforeunload",function(){if(realtimeClient)realtimeClient.removeAllChannels();if(realtimeTimer)clearTimeout(realtimeTimer);if(clockTimer)clearInterval(clockTimer);if(fallbackTimer)clearInterval(fallbackTimer);});
})();
</script>
</body>
</html>
